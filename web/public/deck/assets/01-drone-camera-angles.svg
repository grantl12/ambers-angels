<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    
    <filter id="car-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.8 0.8"></feGaussianBlur>
    </filter>
    
    <filter id="plate-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur>
      <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    
    <linearGradient id="fov-fill" x1="0" y1="0" x2="0" y2="1">
