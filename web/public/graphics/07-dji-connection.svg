<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" font-family="system-ui,-apple-system,sans-serif">
  <rect width="880" height="480" fill="#050a0f"/>

  <!-- Title -->
  <text x="440" y="36" text-anchor="middle" fill="#fff" font-size="18" font-weight="700" letter-spacing="0.5">Connecting Your DJI Drone</text>
  <line x1="40" y1="50" x2="840" y2="50" stroke="rgba(167,139,250,0.4)" stroke-width="1"/>

  <!-- ── STEP 1 ── -->
  <rect x="10" y="62" width="185" height="308" rx="10" fill="rgba(167,139,250,0.04)" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
  <circle cx="36" cy="90" r="16" fill="#a78bfa"/>
  <text x="36" y="96" text-anchor="middle" fill="#050a0f" font-size="14" font-weight="800">1</text>
  <text x="60" y="86" fill="#a78bfa" font-size="13" font-weight="700">Power On</text>
  <text x="60" y="102" fill="rgba(255,255,255,0.4)" font-size="11">Wait for GPS lock</text>

  <!-- Drone top-down icon -->
  <g transform="translate(102,178)">
    <rect x="-13" y="-9" width="26" height="18" rx="3" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
    <circle cx="0" cy="1" r="3.5" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.6"/>
    <line x1="-13" y1="-9" x2="-32" y2="-28" stroke="#475569" stroke-width="1.5"/>
    <ellipse cx="-36" cy="-31" rx="12" ry="3.5" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.8"/>
    <line x1="13" y1="-9" x2="32" y2="-28" stroke="#475569" stroke-width="1.5"/>
    <ellipse cx="36" cy="-31" rx="12" ry="3.5" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.8"/>
    <line x1="-13" y1="9" x2="-32" y2="28" stroke="#475569" stroke-width="1.5"/>
    <ellipse cx="-36" cy="31" rx="12" ry="3.5" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.8"/>
    <line x1="13" y1="9" x2="32" y2="28" stroke="#475569" stroke-width="1.5"/>
    <ellipse cx="36" cy="31" rx="12" ry="3.5" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- GPS bars -->
  <rect x="62" y="204" width="6" height="8"  rx="1" fill="#22c55e"/>
  <rect x="72" y="200" width="6" height="12" rx="1" fill="#22c55e"/>
  <rect x="82" y="195" width="6" height="17" rx="1" fill="#22c55e"/>
  <rect x="92" y="190" width="6" height="22" rx="1" fill="#22c55e"/>
  <text x="104" y="211" fill="rgba(34,197,94,0.85)" font-size="9" font-weight="600">LOCKED</text>

  <text x="20" y="242" fill="rgba(255,255,255,0.55)" font-size="11">Drone · RC · phone.</text>
  <text x="20" y="258" fill="rgba(255,255,255,0.55)" font-size="11">Wait for solid green GPS</text>
  <text x="20" y="274" fill="rgba(255,255,255,0.55)" font-size="11">on RC before next step.</text>
  <text x="20" y="294" fill="rgba(255,255,255,0.28)" font-size="10" font-style="italic">Open sky for best lock.</text>
  <text x="20" y="312" fill="rgba(255,255,255,0.28)" font-size="10" font-style="italic">Indoor GPS lock not reliable.</text>

  <!-- Arrow 1→2 -->
  <line x1="198" y1="216" x2="218" y2="216" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3,2"/>
  <polygon points="218,210 230,216 218,222" fill="#a78bfa"/>

  <!-- ── STEP 2 ── -->
  <rect x="240" y="62" width="185" height="308" rx="10" fill="rgba(167,139,250,0.04)" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
  <circle cx="266" cy="90" r="16" fill="#a78bfa"/>
  <text x="266" y="96" text-anchor="middle" fill="#050a0f" font-size="14" font-weight="800">2</text>
  <text x="290" y="86" fill="#a78bfa" font-size="13" font-weight="700">Set Drone Mode</text>
  <text x="290" y="102" fill="rgba(255,255,255,0.4)" font-size="11">Settings → Volunteer</text>

  <!-- Phone + mode toggle -->
  <g transform="translate(332,175)">
    <rect x="-27" y="-52" width="54" height="94" rx="8" fill="#0d1117" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
    <rect x="-21" y="-46" width="42" height="80" rx="4" fill="#111827"/>
    <rect x="-21" y="-46" width="42" height="8" rx="4" fill="#0d1117"/>
    <text x="0" y="-28" text-anchor="middle" fill="rgba(255,255,255,0.28)" font-size="7" letter-spacing="1">MODE</text>
    <!-- toggle background -->
    <rect x="-19" y="-20" width="38" height="16" rx="4" fill="#1e293b"/>
    <!-- active segment: DRONE (right-of-center) -->
    <rect x="-4" y="-19" width="23" height="14" rx="3" fill="#f59e0b"/>
    <text x="-13" y="-10" text-anchor="middle" fill="rgba(255,255,255,0.22)" font-size="6">PH</text>
    <text x="8" y="-9" text-anchor="middle" fill="#050a0f" font-size="7" font-weight="800">DRN</text>
    <text x="24" y="-10" text-anchor="middle" fill="rgba(255,255,255,0.22)" font-size="6">ALL</text>
    <text x="0" y="6" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-size="8">Volunteer Mode</text>
    <rect x="-14" y="14" width="28" height="10" rx="3" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.35)" stroke-width="1"/>
    <text x="0" y="22" text-anchor="middle" fill="rgba(245,158,11,0.8)" font-size="6" font-weight="700">SAVE</text>
    <rect x="-8" y="28" width="16" height="2.5" rx="1.5" fill="rgba(255,255,255,0.18)"/>
  </g>

  <text x="250" y="242" fill="rgba(255,255,255,0.55)" font-size="11">Open Settings, select</text>
  <text x="250" y="258" fill="rgba(255,255,255,0.55)" font-size="11">Volunteer Mode, choose</text>
  <text x="250" y="274" fill="rgba(255,255,255,0.55)" font-size="11">Drone. Save and return.</text>
  <text x="250" y="294" fill="rgba(255,255,255,0.28)" font-size="10" font-style="italic">DJI SDK key required.</text>

  <!-- Arrow 2→3 -->
  <line x1="428" y1="216" x2="448" y2="216" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3,2"/>
  <polygon points="448,210 460,216 448,222" fill="#a78bfa"/>

  <!-- ── STEP 3 ── -->
  <rect x="470" y="62" width="185" height="308" rx="10" fill="rgba(167,139,250,0.04)" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
  <circle cx="496" cy="90" r="16" fill="#a78bfa"/>
  <text x="496" y="96" text-anchor="middle" fill="#050a0f" font-size="14" font-weight="800">3</text>
  <text x="520" y="86" fill="#a78bfa" font-size="13" font-weight="700">Check Status</text>
  <text x="520" y="102" fill="rgba(255,255,255,0.4)" font-size="11">Verify DJI connection</text>

  <!-- Phone with status -->
  <g transform="translate(562,175)">
    <rect x="-27" y="-52" width="54" height="94" rx="8" fill="#0d1117" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
    <rect x="-21" y="-46" width="42" height="80" rx="4" fill="#111827"/>
    <rect x="-21" y="-46" width="42" height="8" rx="4" fill="#0d1117"/>
    <!-- status dot -->
    <circle cx="-10" cy="-24" r="4" fill="#22c55e"/>
    <text x="2" y="-21" fill="rgba(255,255,255,0.45)" font-size="7">STANDBY</text>
    <text x="0" y="-8"  text-anchor="middle" fill="#22c55e" font-size="8" font-weight="700">DJI connected</text>
    <text x="0" y="4"   text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="7">SDK initialized</text>
    <rect x="-18" y="12" width="36" height="12" rx="4" fill="#22c55e"/>
    <text x="0" y="21"  text-anchor="middle" fill="#fff" font-size="7" font-weight="800">START MISSION</text>
    <rect x="-8" y="28" width="16" height="2.5" rx="1.5" fill="rgba(255,255,255,0.18)"/>
  </g>

  <text x="480" y="242" fill="rgba(255,255,255,0.55)" font-size="11">Green dot = connected.</text>
  <text x="480" y="258" fill="rgba(255,255,255,0.55)" font-size="11">SDK initialized = ready.</text>
  <text x="480" y="274" fill="rgba(255,255,255,0.55)" font-size="11">Tap Start Mission.</text>

  <!-- error callout -->
  <rect x="476" y="296" width="173" height="22" rx="4" fill="rgba(239,68,68,0.07)" stroke="rgba(239,68,68,0.25)" stroke-width="1"/>
  <text x="562" y="311" text-anchor="middle" fill="rgba(239,68,68,0.8)" font-size="9">Red? Check DJI key · relaunch app</text>

  <!-- Arrow 3→4 -->
  <line x1="658" y1="216" x2="678" y2="216" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3,2"/>
  <polygon points="678,210 690,216 678,222" fill="#22c55e"/>

  <!-- ── STEP 4 ── -->
  <rect x="700" y="62" width="170" height="308" rx="10" fill="rgba(34,197,94,0.05)" stroke="rgba(34,197,94,0.28)" stroke-width="1"/>
  <circle cx="726" cy="90" r="16" fill="#22c55e"/>
  <text x="726" y="96" text-anchor="middle" fill="#050a0f" font-size="14" font-weight="800">4</text>
  <text x="750" y="86" fill="#22c55e" font-size="13" font-weight="700">Start Mission</text>
  <text x="750" y="102" fill="rgba(255,255,255,0.4)" font-size="11">Drone goes live</text>

  <!-- Drone + upload icon -->
  <g transform="translate(785,163)">
    <!-- cloud shape -->
    <path d="M-22,-46 C-28,-58 -12,-66 -4,-58 C0,-70 14,-70 18,-60 C26,-60 28,-50 22,-44 Z"
          fill="rgba(34,197,94,0.1)" stroke="#22c55e" stroke-width="1.5"/>
    <!-- upload arrow -->
    <line x1="-4" y1="-28" x2="-4" y2="-42" stroke="#22c55e" stroke-width="2"/>
    <polygon points="-4,-46 -10,-36 2,-36" fill="#22c55e"/>
    <!-- data label -->
    <rect x="-26" y="-20" width="52" height="13" rx="3" fill="rgba(34,197,94,0.08)" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
    <text x="0" y="-10" text-anchor="middle" fill="#22c55e" font-size="8">frame + GPS</text>
    <!-- drone body -->
    <rect x="-11" y="6" width="22" height="15" rx="3" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="0" cy="12" r="3" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
    <!-- arms + props -->
    <line x1="-11" y1="6"  x2="-28" y2="-8"  stroke="#22c55e" stroke-width="1.5"/>
    <ellipse cx="-32" cy="-11" rx="10" ry="3" fill="none" stroke="#22c55e" stroke-width="1.2" opacity="0.7"/>
    <line x1="11"  y1="6"  x2="28"  y2="-8"  stroke="#22c55e" stroke-width="1.5"/>
    <ellipse cx="32"  cy="-11" rx="10" ry="3" fill="none" stroke="#22c55e" stroke-width="1.2" opacity="0.7"/>
    <line x1="-11" y1="21" x2="-28" y2="35"  stroke="#22c55e" stroke-width="1.5"/>
    <ellipse cx="-32" cy="38"  rx="10" ry="3" fill="none" stroke="#22c55e" stroke-width="1.2" opacity="0.7"/>
    <line x1="11"  y1="21" x2="28"  y2="35"  stroke="#22c55e" stroke-width="1.5"/>
    <ellipse cx="32"  cy="38"  rx="10" ry="3" fill="none" stroke="#22c55e" stroke-width="1.2" opacity="0.7"/>
  </g>

  <text x="710" y="242" fill="rgba(255,255,255,0.55)" font-size="11">Frames upload live.</text>
  <text x="710" y="258" fill="rgba(255,255,255,0.55)" font-size="11">GPS: drone primary,</text>
  <text x="710" y="274" fill="rgba(255,255,255,0.55)" font-size="11">phone as fallback.</text>
  <text x="710" y="294" fill="rgba(255,255,255,0.28)" font-size="10" font-style="italic">Heading + alt. when available.</text>

  <!-- ── FOOTER ── -->
  <rect x="10" y="382" width="860" height="86" rx="8" fill="rgba(245,158,11,0.05)" stroke="rgba(245,158,11,0.2)" stroke-width="1"/>
  <text x="30" y="404" fill="#f59e0b" font-size="12" font-weight="700">DJI Avata note</text>
  <text x="124" y="404" fill="rgba(255,255,255,0.5)" font-size="12">streams via RTMP — no GPS in stream metadata. Coordinates use a static fallback by design.</text>
  <text x="30"  y="422" fill="rgba(255,255,255,0.4)" font-size="11">Full GPS telemetry (heading + altitude) requires Mavic or Mini series via DJI Mobile SDK.</text>
  <text x="30"  y="440" fill="rgba(255,255,255,0.4)" font-size="11">DJI Mobile SDK integration is planned for Phase 2.</text>
  <text x="30"  y="458" fill="rgba(255,255,255,0.25)" font-size="10">Phantom 4 and older: partial support depending on SDK version installed.</text>
</svg>
