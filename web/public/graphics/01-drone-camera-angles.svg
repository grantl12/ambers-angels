<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <filter id="blur-car" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="2.4 0.7"/>
    </filter>
    <filter id="glow-plate" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="sky-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#050a0f"/>
      <stop offset="100%" stop-color="#071220"/>
    </linearGradient>
    <linearGradient id="safe-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#22c55e" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="fov-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" fill="#fff" font-size="18" font-weight="700" letter-spacing="0.5">Safe Aerial LPR — Optimal Positioning</text>
  <line x1="50" y1="46" x2="850" y2="46" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>

  <!-- Sky background -->
  <rect x="0" y="46" width="900" height="252" fill="url(#sky-grad)"/>

  <!-- Safe zone tint (right of x=590) -->
  <rect x="590" y="46" width="310" height="330" fill="url(#safe-grad)"/>

  <!-- Zone labels in sky -->
  <text x="50"  y="76" fill="rgba(239,68,68,0.5)"  font-size="10" font-weight="700" letter-spacing="2">ACTIVE ROAD ZONE</text>
  <text x="612" y="76" fill="rgba(34,197,94,0.65)"  font-size="10" font-weight="700" letter-spacing="2">SAFE PILOT ZONE</text>

  <!-- Zone divider -->
  <line x1="590" y1="46" x2="590" y2="378" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="6,5"/>

  <!-- "do not fly over active lanes" -->
  <text x="290" y="250" text-anchor="middle" fill="rgba(239,68,68,0.3)" font-size="9" letter-spacing="1">do not fly over active lanes</text>

  <!-- ── FOV CONE ── from drone (754,118) to road -->
  <polygon points="754,118 215,296 450,296" fill="url(#fov-grad)"/>
  <line x1="754" y1="118" x2="215" y2="296" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="7,4" opacity="0.5"/>
  <line x1="754" y1="118" x2="450" y2="296" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="7,4" opacity="0.5"/>
  <text x="490" y="224" fill="#38bdf8" font-size="11" font-weight="600" opacity="0.7">field of view</text>

  <!-- ── ROAD ── -->
  <rect x="0"   y="296" width="900" height="82" fill="#111a10"/>
  <rect x="0"   y="296" width="900" height="82" fill="rgba(255,255,255,0.018)"/>
  <!-- road edge lines -->
  <line x1="0" y1="298" x2="900" y2="298" stroke="rgba(255,255,255,0.2)"  stroke-width="1.5"/>
  <line x1="0" y1="376" x2="900" y2="376" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <!-- center dashes -->
  <line x1="0" y1="337" x2="900" y2="337" stroke="rgba(255,220,0,0.3)" stroke-width="2" stroke-dasharray="34,22"/>

  <!-- ── GROUND / SHOULDER ── -->
  <rect x="0"   y="376" width="900" height="46" fill="#0d1a0d"/>
  <rect x="590" y="376" width="310" height="46" fill="rgba(34,197,94,0.06)"/>

  <!-- ── CAR (blurred) ── -->
  <g filter="url(#blur-car)">
    <!-- main body -->
    <path d="M228,372 L428,372 L428,348 L406,332 L376,296 L268,296 L246,316 L228,332 Z"
          fill="#2b3e52" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <!-- windows -->
    <polygon points="268,296 306,296 298,316 258,316" fill="rgba(56,189,248,0.16)"/>
    <polygon points="310,296 374,296 372,316 308,316" fill="rgba(56,189,248,0.14)"/>
    <polygon points="378,296 404,328 388,332 368,316" fill="rgba(56,189,248,0.10)"/>
    <!-- wheels -->
    <circle cx="268" cy="374" r="20" fill="#0d1117" stroke="rgba(255,255,255,0.16)" stroke-width="2"/>
    <circle cx="268" cy="374" r="10" fill="#1a1a2e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="390" cy="374" r="20" fill="#0d1117" stroke="rgba(255,255,255,0.16)" stroke-width="2"/>
    <circle cx="390" cy="374" r="10" fill="#1a1a2e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- headlights (front-right) -->
    <rect x="420" y="332" width="8" height="10" rx="1" fill="rgba(255,240,180,0.45)"/>
    <!-- taillights (rear-left) -->
    <rect x="228" y="336" width="8" height="10" rx="1" fill="rgba(255,80,60,0.4)"/>
  </g>

  <!-- ── LICENSE PLATE (sharp, with glow) ── -->
  <g filter="url(#glow-plate)">
    <rect x="358" y="350" width="50" height="16" rx="2" fill="#d4d4c8"/>
    <text x="383" y="362" text-anchor="middle" fill="#050a0f" font-size="8" font-weight="800" letter-spacing="1.2">GHB 4827</text>
  </g>
  <!-- detection box -->
  <rect x="354" y="346" width="58" height="24" rx="2" fill="none" stroke="#22c55e" stroke-width="1.8" opacity="0.95"/>

  <!-- plate callout line + label -->
  <line x1="354" y1="358" x2="196" y2="240" stroke="rgba(34,197,94,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="60" y="218" width="152" height="38" rx="5" fill="rgba(34,197,94,0.08)" stroke="rgba(34,197,94,0.35)" stroke-width="1"/>
  <text x="136" y="234" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700">PLATE IN FOCUS</text>
  <text x="136" y="249" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="10">OpenALPR score: 94%</text>

  <!-- ── DRONE ── at (754, 118), in safe zone -->
  <g transform="translate(754,118)">
    <!-- body -->
    <rect x="-14" y="-10" width="28" height="20" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="0" cy="1" r="4" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>
    <!-- arms -->
    <line x1="-14" y1="-10" x2="-36" y2="-30" stroke="#334155" stroke-width="2"/>
    <line x1="14"  y1="-10" x2="36"  y2="-30" stroke="#334155" stroke-width="2"/>
    <line x1="-14" y1="10"  x2="-36" y2="30"  stroke="#334155" stroke-width="2"/>
    <line x1="14"  y1="10"  x2="36"  y2="30"  stroke="#334155" stroke-width="2"/>
    <!-- props -->
    <ellipse cx="-40" cy="-33" rx="14" ry="4.5" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.85"/>
    <ellipse cx="40"  cy="-33" rx="14" ry="4.5" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.85"/>
    <ellipse cx="-40" cy="33"  rx="14" ry="4.5" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.85"/>
    <ellipse cx="40"  cy="33"  rx="14" ry="4.5" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.85"/>
  </g>

  <!-- SAFE ZONE badge -->
  <rect x="696" y="72" width="108" height="24" rx="4" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.45)" stroke-width="1"/>
  <text x="750" y="88" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700">SAFE ZONE</text>
  <line x1="750" y1="96" x2="754" y2="108" stroke="rgba(34,197,94,0.4)" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- "NOT over road" note -->
  <text x="754" y="62" text-anchor="middle" fill="rgba(255,255,255,0.28)" font-size="9">shoulder / field — not over road</text>

  <!-- ── ANGLE ARC ── -->
  <path d="M 754 185 A 68 68 0 0 0 710 154" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="692" y="194" fill="#f59e0b" font-size="14" font-weight="700">~35°</text>
  <text x="688" y="208" fill="rgba(245,158,11,0.55)" font-size="9">optimal</text>

  <!-- vertical RC link line -->
  <line x1="754" y1="138" x2="754" y2="376" stroke="rgba(255,255,255,0.07)" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ── HEIGHT INDICATOR ── -->
  <line x1="858" y1="118" x2="858" y2="296" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="850" y1="118" x2="866" y2="118" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <line x1="850" y1="296" x2="866" y2="296" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <text x="874" y="212" fill="#38bdf8" font-size="12" font-weight="600">≤200 ft</text>
  <text x="876" y="228" fill="rgba(56,189,248,0.55)" font-size="10">AGL</text>

  <!-- ── PILOT FIGURE ── at x=838, standing on shoulder (y=376) -->
  <!-- legs -->
  <line x1="832" y1="418" x2="828" y2="378" stroke="#475569" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="844" y1="418" x2="840" y2="378" stroke="#475569" stroke-width="3.5" stroke-linecap="round"/>
  <!-- hi-vis vest / torso -->
  <rect x="824" y="356" width="22" height="24" rx="3" fill="#f59e0b" opacity="0.92"/>
  <!-- vest stripe -->
  <line x1="824" y1="365" x2="846" y2="365" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <!-- left arm (down at side) -->
  <line x1="824" y1="360" x2="814" y2="378" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <!-- right arm (holding remote, extended right) -->
  <line x1="846" y1="360" x2="860" y2="368" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <!-- remote controller -->
  <rect x="860" y="362" width="22" height="13" rx="3" fill="#1e293b" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="865" cy="368" r="2"  fill="rgba(255,255,255,0.3)"/>
  <circle cx="876" cy="368" r="2"  fill="rgba(255,255,255,0.3)"/>
  <!-- head -->
  <circle cx="836" cy="347" r="9"  fill="#334155"/>
  <!-- helmet -->
  <path d="M826,347 A10,10 0 0,1 846,347" fill="#475569"/>
  <rect  x="824" y="345" width="24" height="4" rx="2" fill="#64748b"/>

  <!-- pilot label -->
  <rect x="720" y="258" width="154" height="34" rx="4" fill="rgba(245,158,11,0.07)" stroke="rgba(245,158,11,0.22)" stroke-width="1"/>
  <text x="797" y="272" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="700">Remote Pilot · Part 107</text>
  <text x="797" y="285" text-anchor="middle" fill="rgba(255,255,255,0.38)" font-size="9">hi-vis · VLOS · off road</text>
  <line x1="800" y1="292" x2="836" y2="338" stroke="rgba(245,158,11,0.25)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ── SAFETY CONE ── at x=648, shoulder edge -->
  <!-- cone body -->
  <polygon points="648,370 662,418 634,418" fill="#f59e0b" opacity="0.88"/>
  <!-- white stripes -->
  <line x1="638" y1="392" x2="658" y2="392" stroke="rgba(255,255,255,0.55)" stroke-width="3"/>
  <line x1="641" y1="404" x2="655" y2="404" stroke="rgba(255,255,255,0.4)"  stroke-width="2"/>
  <!-- base -->
  <rect x="630" y="416" width="36" height="6" rx="2" fill="#f59e0b" opacity="0.6"/>

  <!-- ── RULES FOOTER ── -->
  <rect x="10" y="432" width="880" height="78" rx="8" fill="rgba(56,189,248,0.05)" stroke="rgba(56,189,248,0.22)" stroke-width="1"/>
  <text x="30" y="452" fill="#38bdf8" font-size="12" font-weight="700">POSITIONING RULES</text>
  <line x1="172" y1="445" x2="876" y2="445" stroke="rgba(56,189,248,0.15)" stroke-width="1"/>
  <text x="30" y="466" fill="rgba(255,255,255,0.65)" font-size="11">Always launch and operate from the road shoulder or adjacent field — never over active lanes.</text>
  <text x="30" y="482" fill="rgba(255,255,255,0.55)" font-size="11">Fly at 30–45° camera angle for best plate reads. Maintain visual line of sight at all times.</text>
  <text x="30" y="498" fill="rgba(255,255,255,0.32)" font-size="10">Safety cone marks your launch zone. Hi-vis vest and helmet recommended. FAA Part 107 applies.</text>
</svg>
