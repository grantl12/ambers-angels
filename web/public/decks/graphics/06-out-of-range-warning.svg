<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"></path>
    </marker>
  </defs>

  
  <rect width="800" height="580" fill="#050a0f"></rect>

  
  <text x="400" y="34" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">The Out-of-Range Warning</text>
  <line x1="40" y1="46" x2="760" y2="46" stroke="rgba(56,189,248,0.3)" stroke-width="1"></line>

  
  <text x="400" y="68" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="11" font-weight="700" letter-spacing="2">PART 1 — WHAT TRIGGERS IT</text>

  
  <rect x="40" y="80" width="720" height="240" fill="#0d1a0d" rx="10" stroke="rgba(255,255,255,0.06)" stroke-width="1"></rect>

  
  <line x1="40" y1="190" x2="760" y2="185" stroke="rgba(255,255,255,0.05)" stroke-width="4"></line>
  <line x1="350" y1="80" x2="355" y2="320" stroke="rgba(255,255,255,0.04)" stroke-width="3"></line>

  
  <polygon points="260,120 370,105 430,145 420,235 310,265 230,235 220,165" fill="rgba(245,158,11,0.18)" stroke="#f59e0b" stroke-width="2"></polygon>
  
  <text x="325" y="190" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="700">FEMA Search Zone</text>

  
  <circle cx="325" cy="188" r="120" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8,5" opacity="0.7"></circle>
  
  <text x="325" y="82" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="600">Alert Range boundary (25 mi)</text>

  
  <circle cx="520" cy="270" r="16" fill="rgba(239,68,68,0.15)" stroke="#ef4444" stroke-width="1.5"></circle>
  <text x="520" y="276" text-anchor="middle" font-size="14">🚁</text>

  
  <line x1="508" y1="260" x2="430" y2="235" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"></line>
  
  <rect x="450" y="240" width="60" height="18" fill="rgba(239,68,68,0.15)" rx="4"></rect>
  <text x="480" y="252" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="700">4.2 mi</text>

  
  <text x="538" y="258" fill="rgba(255,255,255,0.5)" font-size="10">You are here</text>
  <text x="538" y="272" fill="#ef4444" font-size="10" font-weight="600">Outside alert range</text>

  
  <rect x="40" y="330" width="720" height="44" fill="rgba(234,88,12,0.07)" rx="8" stroke="rgba(234,88,12,0.2)" stroke-width="1"></rect>
  <text x="400" y="348" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="12">When you exceed your Alert Range from the active search polygon, the app fires a</text>
  <text x="400" y="366" text-anchor="middle" fill="#fb923c" font-size="12" font-weight="600">push notification + orange warning card on the map and camera screens.</text>

  
  <line x1="40" y1="388" x2="760" y2="388" stroke="rgba(255,255,255,0.06)" stroke-width="1"></line>

  
  <text x="400" y="408" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="11" font-weight="700" letter-spacing="2">PART 2 — WHAT TO DO</text>

  
  <rect x="40" y="422" width="214" height="120" fill="rgba(56,189,248,0.05)" rx="10" stroke="rgba(56,189,248,0.15)" stroke-width="1"></rect>
  <text x="147" y="452" text-anchor="middle" font-size="28">🗺</text>
  <text x="147" y="476" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">Check the map</text>
  <text x="147" y="493" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="10">Are you still heading</text>
  <text x="147" y="508" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="10">toward the search area?</text>
  <text x="147" y="525" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="10">Tap the alert pin for details.</text>

  
  <rect x="293" y="422" width="214" height="120" fill="rgba(34,197,94,0.05)" rx="10" stroke="rgba(34,197,94,0.15)" stroke-width="1"></rect>
  <text x="400" y="452" text-anchor="middle" font-size="28">↩</text>
  <text x="400" y="476" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="700">Return to the zone</text>
  <text x="400" y="493" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="10">The warning clears</text>
  <text x="400" y="508" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="10">automatically once you&#39;re</text>
  <text x="400" y="525" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="10">back inside the boundary.</text>

  
  <rect x="546" y="422" width="214" height="120" fill="rgba(167,139,250,0.05)" rx="10" stroke="rgba(167,139,250,0.15)" stroke-width="1"></rect>
  <text x="653" y="452" text-anchor="middle" font-size="28">⚙</text>
  <text x="653" y="476" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="700">Adjust Alert Range</text>
  <text x="653" y="493" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="10">In Settings if your patrol</text>
  <text x="653" y="508" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="10">area is intentionally far</text>
  <text x="653" y="525" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="10">from the search polygon.</text>

  
  <text x="400" y="558" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-size="10">Notifications are edge-triggered and throttled to once per 5 minutes — you will not be spammed.</text>
</svg>