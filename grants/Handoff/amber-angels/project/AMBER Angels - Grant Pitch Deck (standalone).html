6F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"5c802f6f-375b-43fe-a5dc-3919aa266d81\"><\u002Fscript>\n<script type=\"application/json\" id=\"speaker-notes\">\n[\n\"Hi, I'm Grant Lindberg, founder of AMBER Angels. We're a 501(c)(3) in formation building a privacy-first, AI-powered volunteer search network — and we're here to ask for your support to launch our pilot in Carroll County, Georgia. Over the next twelve slides I'll show you what we do, why it matters, and exactly how every grant dollar translates into mission impact. Thank you for your time.\",\n\"Here's why this work is urgent. According to OJJDP and the National Center for Missing and Exploited Children, seventy-six percent of abducted children who are murdered are killed within the first three hours. The data is brutal — and it tells us that the bottleneck in child recovery isn't investigation, it's coverage. The first window is everything. That's the gap we exist to close.\",\n\"Carroll County is our pilot ground. Five hundred and three square miles, fewer than twelve fixed automated license plate readers, and dozens of high-probability escape corridors with zero coverage. This isn't a Carroll County problem — it's a rural America problem. Roughly sixty percent of US counties have under five fixed cameras. We're building infrastructure for the places commercial vendors can't economically reach.\",\n\"Our solution is a distributed AI search grid powered by community volunteers. Any approved volunteer with a smartphone can participate during an active alert — no special hardware. Our cascade inference engine identifies make, model, year range, and plate, so we can find the suspect vehicle even when plates are switched. And every architectural decision is privacy-first: raw footage deleted immediately, no surveillance database, human-in-the-loop review.\",\n\"Let me be direct about positioning. Commercial LPR vendors like Flock have built remarkable infrastructure for cities and HOAs that can afford it. We are not competing with them and we don't want to. We're filling the gap they can't economically reach: rural counties, secondary roads, and the volunteer-hour multiplier that no for-profit camera network can match. We complement existing infrastructure — we don't replace it.\",\n\"Here's the cost comparison. A typical Flock-style fixed camera deployment runs about three thousand dollars per camera per year on subscription, plus install. A county Sheriff buying twenty-five cameras pays roughly seventy-five thousand annually — recurring, forever. Our model deploys twenty-five active mobile nodes for under thirty-five thousand in year one, with no recurring license fees because we're built on open source. The asymmetry is the whole point.\",\n\"Now the ROI math. Twenty-five active volunteers covering forty miles per node per active alert is roughly one thousand additional road-miles of coverage per AMBER Alert event. Our VMMC dual-verification reduces false-positive rate from about thirty percent for plate-only systems to under five percent. And every hour of volunteer search time donated is roughly twenty-eight dollars of in-kind labor value the community contributes — which most federal funders count as match.\",\n\"This is our use of funds for a twelve-month grant of three hundred eighty-five thousand dollars. Forty percent goes to operations and personnel — including a part-time program coordinator and volunteer training infrastructure. Twenty-five percent to AI model development and accuracy improvements. Twenty percent to technology infrastructure and compliance. Ten percent to public transparency reporting. Five percent to administrative overhead. No software licensing fees because we own our stack.\",\n\"Privacy isn't a feature for us, it's the foundation. We don't archive video. We don't build a database of innocent citizens. Every detection requires human coordinator review before it ever reaches law enforcement. We publish public transparency reports on retention and accuracy. This is what separates community-trusted infrastructure from surveillance infrastructure — and it's why we can operate where commercial vendors face community pushback.\",\n\"Why us. I'm an AI technologist with prior service as a military intelligence professional, air defense expert, and currently working in financial technology — bringing the security mindset and engineering rigor that mission-critical software requires. I have over a thousand hours of drone flight time. We're a Service-Disabled Veteran-Owned small business by founding ethos, structured as a 501(c)(3) so every grant dollar is deductible and mission-direct.\",\n\"Here are our six-month pilot milestones. Month one through three: enroll thirty ground volunteers, recruit five Part 107-certified drone pilots, and complete platform integration testing. Month four through five: live AMBER alert response readiness and field exercises with law enforcement observers. Month six: published transparency report on detection accuracy, false positive rates, and privacy compliance. Every milestone is measurable, every metric is publishable.\",\n\"This is the multi-year vision. Year one: Carroll County pilot proves the model. Year two: scale to five Georgia counties on the same operational template. Year three: ten-state expansion, federal partnership pathway, and grant-funded coordinator positions in each region. We're not building a startup — we're building public-interest infrastructure. The funding curve flattens because the marginal cost of each new volunteer is essentially zero.\",\n\"What we're asking for. Three hundred eighty-five thousand dollars for a twelve-month grant gets the Carroll County pilot fully operational, demonstrates the model at scale, publishes transparency data the field can build on, and seeds the year-two expansion. We're approaching multiple funders — federal, foundation, and corporate — so partial funding moves the mission forward. Every dollar is mission-direct.\",\n\"Thank you for your time and for considering us. We believe technology should protect the innocent without surveilling them, and that volunteers given the right tools can save lives the existing system can't reach. If you'd like to talk further, I'm Grant Lindberg, info at amberangels.org. We'd be honored to have your partnership.\"\n]\n<\u002Fscript>\n<style>\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n:root {\n  --amber: #f59e0b;\n  --amber-soft: #fbbf24;\n  --sky: #38bdf8;\n  --green: #22c55e;\n  --red: #ef4444;\n  --purple: #a78bfa;\n  --ink: #050a0f;\n  --ink2: #0d1117;\n  --ink3: #111827;\n  --ink4: #1a2332;\n  --text: rgba(255,255,255,0.92);\n  --muted: rgba(255,255,255,0.55);\n  --dim: rgba(255,255,255,0.3);\n  --border: rgba(255,255,255,0.08);\n  --border-strong: rgba(255,255,255,0.14);\n}\nsection {\n  width: 1920px; height: 1080px;\n  font-family: 'Space Grotesk', sans-serif;\n  background: var(--ink);\n  color: var(--text);\n  position: relative;\n  overflow: hidden;\n  -webkit-font-smoothing: antialiased;\n}\n.sn { position: absolute; bottom: 40px; right: 56px; font-size: 24px; color: var(--dim); font-weight: 500; letter-spacing: 1px; }\n.brand { position: absolute; top: 40px; left: 56px; display: flex; align-items: center; gap: 14px; z-index: 5; }\n.brand img { width: 44px; height: 44px; border-radius: 50%; }\n.brand span { font-size: 22px; font-weight: 700; color: rgba(255,255,255,0.7); letter-spacing: 0.3px; }\n.brand em { color: var(--amber); font-style: normal; }\n.tag { display: inline-block; font-size: 24px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--amber); border: 1px solid rgba(245,158,11,0.3); padding: 9px 18px; border-radius: 4px; background: rgba(245,158,11,0.07); }\n.gridbg::after { content:''; position:absolute; inset:0; background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-grad (0,0,0,0.04) 50px, rgba(0,0,0,0.04) 51px); }\n.s13-l .label { font-size: 22px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: rgba(12,10,5,0.6); margin-bottom: 24px; position: relative; }\n.s13-amt { font-size: 200px; font-weight: 700; color: var(--ink); line-height: 1; letter-spacing: -8px; position: relative; margin-bottom: 16px; }\n.s13-period { font-size: 32px; font-weight: 700; color: var(--ink); position: relative; margin-bottom: 32px; }\n.s13-frame { font-size: 24px; color: rgba(12,10,5,0.7); line-height: 1.6; max-width: 540px; position: relative; }\n.s13-r { flex: 1; background: var(--ink); padding: 110px 96px; display: flex; flex-direction: column; justify-content: center; }\n.s13-r h2 { font-size: 48px; font-weight: 700; line-height: 1.15; letter-spacing: -1px; margin-bottom: 36px; }\n.s13-r h2 em { color: var(--amber); font-style: normal; }\n.s13-list { list-style: none; display: flex; flex-direction: column; gap: 20px; margin-bottom: 36px; }\n.s13-list li { display: flex; gap: 20px; align-items: flex-start; }\n.s13-list svg { flex-shrink: 0; margin-top: 6px; }\n.s13-list .text { font-size: 22px; color: var(--muted); line-height: 1.55; }\n.s13-list .text strong { color: #fff; font-weight: 600; }\n.s13-r .partial { padding: 24px 32px; background: var(--ink2); border: 1px solid var(--border); border-left: 3px solid var(--amber); border-radius: 8px; font-size: 20px; color: var(--muted); line-height: 1.6; }\n.s13-r .partial strong { color: var(--amber); font-weight: 700; }\n\n/* ── 14 CLOSE ── */\n#s14 { background: var(--amber); display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; position: relative; padding: 80px; }\n#s14::before { content:''; position:absolute; inset:0; background: repeating-linear-gradient(-45deg, transparent, transparent 50px, rgba(0,0,0,0.05) 50px, rgba(0,0,0,0.05) 51px); }\n.s14-logo { width: 92px; height: 92px; border-radius: 50%; margin-bottom: 32px; position: relative; z-index: 1; }\n.s14-org { font-size: 22px; font-weight: 700; letter-spacing: 5px; text-transform: uppercase; color: var(--ink); opacity: 0.55; margin-bottom: 24px; position: relative; z-index: 1; }\n.s14-headline { font-size: 78px; font-weight: 700; color: var(--ink); letter-spacing: -2px; line-height: 1.1; max-width: 1400px; position: relative; z-index: 1; margin-bottom: 28px; }\n.s14-cta { font-size: 36px; font-weight: 700; color: var(--ink); position: relative; z-index: 1; margin-bottom: 56px; }\n.s14-contact { display: flex; gap: 80px; position: relative; z-index: 1; }\n.s14-c-item { text-align: center; min-width: 280px; }\n.s14-c-label { font-size: 22px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(12,10,5,0.45); margin-bottom: 10px; }\n.s14-c-val { font-size: 26px; font-weight: 700; color: var(--ink); }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<deck-stage>\n\n  <!-- ── 01 TITLE ── -->\n  <section id=\"s1\" data-screen-label=\"01 Title\">\n    <div class=\"s1-inner\">\n      <img src=\"2d48698e-c272-46ee-be68-b4d025366d3e\" class=\"s1-logo\" alt=\"AA\">\n      <div class=\"s1-org\">AMBER Angels<\u002Fdiv>\n      <h1 class=\"s1-headline\">A volunteer search network<br>for <em>under $400K.<\u002Fem><\u002Fh1>\n      <p class=\"s1-sub\">Privacy-first, AI-powered missing persons response that closes the rural coverage gap commercial vendors can't economically reach.<\u002Fp>\n      <div class=\"s1-meta\">\n        <div class=\"s1-meta-item\"><div class=\"s1-meta-label\">Pilot<\u002Fdiv><div class=\"s1-meta-val\">Carroll County, GA<\u002Fdiv><\u002Fdiv>\n        <div class=\"s1-meta-item\"><div class=\"s1-meta-label\">Funding Sought<\u002Fdiv><div class=\"s1-meta-val\"><span class=\"amber\">$385,000<\u002Fspan> · 12 months<\u002Fdiv><\u002Fdiv>\n        <div class=\"s1-meta-item\"><div class=\"s1-meta-label\">Status<\u002Fdiv><div class=\"s1-meta-val\">501(c)(3) in formation<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"s1-bottom\">Grant Lindberg, Founder &amp; Executive Director &nbsp;·&nbsp; info@amberangels.org &nbsp;·&nbsp; amberangels.org<\u002Fdiv>\n    <div class=\"sn\">01 / 14<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── 02 THE STAKES ── -->\n  <section id=\"s2\" data-screen-label=\"02 The Stakes\">\n    <div class=\"s2-l\">\n      <div class=\"s2-l-stat\">76%<\u002Fdiv>\n      <div class=\"s2-l-label\">of abducted children who are murdered are killed within the first 3 hours.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"s2-r\">\n      <span class=\"tag\">The Mission Window<\u002Fspan>\n      <h2>The bottleneck isn't<br>investigation. It's <em>coverage.<\u002Fem><\u002Fh2>\n      <p>Law enforcement has powerful tools, but their reach is limited by personnel and the fixed locations of stationary license plate readers. In the first three hours — when recovery is most likely — coverage is the variable that can be changed.<\u002Fp>\n      <div class=\"src\">Source: OJJDP / National Center for Missing &amp; Exploited Children, \"When the Child Returns Home\" report<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"brand\"><img src=\"2d48698e-c272-46ee-be68-b4d025366d3e\" alt=\"AA\"><span>AMBER <em>Angels<\u002Fem><\u002Fspan><\u002Fdiv>\n    <div class=\"sn\">02 / 14<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── 03 COVERAGE GAP ── -->\n  <section id=\"s3\" data-screen-label=\"03 Coverage Gap\" class=\"gridbg\">\n    <span class=\"tag\">The Coverage Problem<\u002Fspan>\n    <h2 style=\"margin-top:28px;\">Rural America has a <em>camera deficit.<\u002Fem><\u002Fh2>\n    <p>Carroll County, Georgia is representative. Commercial LPR vendors deploy where municipal budgets and HOA fees can sustain $3,000+/camera/year subscriptions. That model breaks in low-density geography — exactly where most missing-persons cases originate.<\u002Fp>\n    <div class=\"s3-cards\">\n      <div class=\"s3-card\">\n        <div class=\"s3-card-num\">503<\u002Fdiv>\n        <div class=\"s3-card-label\">square miles<\u002Fdiv>\n        <div class=\"s3-card-desc\">Carroll County's terrain — mixed rural and suburban — must be searchable in the first response window.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"s3-card\">\n        <div class=\"s3-card-num\">&lt;12<\u002Fdiv>\n        <div class=\"s3-card-label\">fixed cameras<\u002Fdiv>\n        <div class=\"s3-card-desc\">Estimated count of automated readers in the county. The gaps include the highest-probability escape corridors.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"s3-card\">\n        <div class=\"s3-card-num\">~60%<\u002Fdiv>\n        <div class=\"s3-card-label\">of US counties<\u002Fdiv>\n        <div class=\"s3-card-desc\">Have under five fixed cameras. The rural coverage gap is national, not local — and it's structural.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"s3-src\">Sources: county procurement records, IACP rural law enforcement surveys 2023–24. Coverage estimates illustrative.<\u002Fp>\n    <div class=\"brand\"><img src=\"2d48698e-c272-46ee-be68-b4d025366d3e\" alt=\"AA\"><span>AMBER <em>Angels<\u002Fem><\u002Fspan><\u002Fdiv>\n    <div class=\"sn\">03 / 14<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── 04 SOLUTION ── -->\n  <section id=\"s4\" data-screen-label=\"04 Solution\">\n    <span class=\"tag\">The Solution<\u002Fspan>\n    <h2 style=\"margin-top:28px;\">Turn smartphones into a <em>distributed search grid.<\u002Fem><\u002Fh2>\n    <p>AMBER Angels is a privacy-first volunteer network that activates during government-issued alerts. Approved community members run our app while driving normal routes — providing law enforcement with real-time, AI-screened, human-reviewed leads.<\u002Fp>\n    <div class=\"s4-grid\">\n      <div class=\"s4-card\">\n        <span class=\"s4-card-num\">01<\u002Fspan>\n        <h3>Zero hardware barrier<\u002Fh3>\n        <p>Volunteers use the smartphones they already own. A car mount is the only physical equipment. Onboarding is hours, not weeks.<\u002Fp>\n        <span class=\"pt\">→ Scales to volunteer headcount, not hardware budget<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"s4-card\">\n        <span class=\"s4-card-num\">02<\u002Fspan>\n        <h3>Cascade Inference Engine<\u002Fh3>\n        <p>YOLOv8 + MobileNetV3 + OpenALPR identify make, model, year range, and plate. Vehicles are findable even when plates are switched.<\u002Fp>\n        <span class=\"pt\">→ &lt;5% false positive rate vs ~30% plate-only<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"s4-card\">\n        <span class=\"s4-card-num\">03<\u002Fspan>\n        <h3>Privacy-first by design<\u002Fh3>\n        <p>Raw footage deleted immediately. No video archive. No surveillance database. Every detection requires human coordinator review.<\u002Fp>\n        <span class=\"pt\">→ Community-trusted, not surveillance infrastructure<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"brand\"><img src=\"2d48698e-c272-46ee-be68-b4d025366d3e\" alt=\"AA\"><span>AMBER <em>Angels<\u002Fem><\u002Fspan><\u002Fdiv>\n    <div class=\"sn\">04 / 14<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── 05 POSITIONING ── -->\n  <section id=\"s5\" data-screen-label=\"05 Positioning\">\n    <div class=\"s5-head\">\n      <div>\n        <span class=\"tag\">Positioning<\u002Fspan>\n        <h2 style=\"margin-top:24px;\">Nonprofit complement, not<br>commercial <em>competitor.<\u002Fem><\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"s5-quote\">Commercial LPR networks have built valuable infrastructure. We are not displacing them. <strong>We're filling the gap they can't economically reach<\u002Fstrong> — rural counties, secondary roads, and the volunteer-hour multiplier no for-profit network can match.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"s5-table\">\n      <div class=\"s5-row head\"><div><\u002Fdiv><div>Commercial LPR (Flock-style)<\u002Fdiv><div class=\"us\">AMBER Angels<\u002Fdiv><\u002Fdiv>\n      <div class=\"s5-row\"><div class=\"lbl\">Business model<\u002Fdiv><div class=\"val\">For-profit subscription<\u002Fdiv><div class=\"val us\">501(c)(3) public benefit<\u002Fdiv><\u002Fdiv>\n      <div class=\"s5-row\"><div class=\"lbl\">Coverage geometry<\u002Fdiv><div class=\"val\">Fixed cameras at chokepoints<\u002Fdiv><div class=\"val us\">Mobile, distributed, volunteer-driven<\u002Fdiv><\u002Fdiv>\n      <div class=\"s5-row\"><div class=\"lbl\">Marginal cost per node<\u002Fdiv><div class=\"val\">$3,000 / camera / year<\u002Fdiv><div class=\"val us\">~$0 (volunteer device)<\u002Fdiv><\u002Fdiv>\n      <div class=\"s5-row\"><div class=\"lbl\">Data retention<\u002Fdiv><div class=\"val\">30+ days standard<\u002Fdiv><div class=\"val us\">Real-time delete after processing<\u002Fdiv><\u002Fdiv>\n      <div class=\"s5-row\"><div class=\"lbl\">Activation model<\u002Fdiv><div class=\"val\">Always-on continuous capture<\u002Fdiv><div class=\"val us\">Alert-triggered only (FEMA IPAWS)<\u002Fdiv><\u002Fdiv>\n      <div class=\"s5-row\"><div class=\"lbl\">Deployment time per county<\u002Fdiv><div class=\"val\">6–12 months install<\u002Fdiv><div class=\"val us\">Hours to volunteer onboard<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"s5-foot\">We co-exist with commercial vendors and intend formal data-sharing partnerships where appropriate. <strong>Our value to the field is the rural and volunteer-driven coverage no commercial economics can sustain.<\u002Fstrong><\u002Fp>\n    <div class=\"brand\"><img src=\"2d48698e-c272-46ee-be68-b4d025366d3e\" alt=\"AA\"><span>AMBER <em>Angels<\u002Fem><\u002Fspan><\u002Fdiv>\n    <div class=\"sn\">05 / 14<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── 06 COST ── -->\n  <section id=\"s6\" data-screen-label=\"06 Cost Asymmetry\">\n    <div class=\"s6-head\"><span class=\"tag\">Cost Asymmetry<\u002Fspan><\u002Fdiv>\n    <h2 style=\"margin-top:24px;\">25 active nodes for the cost of <em>11 fixed cameras.<\u002Fem><\u002Fh2>\n    <div class=\"s6-comp\">\n      <div class=\"s6-card them\">\n        <span class=\"label\">Commercial Comparable<\u002Fspan>\n        <h3>25 fixed LPR cameras<\u002Fh3>\n        <div class=\"s6-bar\"><span class=\"num\" style=\"color:#fff;\">$75K<\u002Fspan><span class=\"unit\">/ year, recurring<\u002Fspan><\u002Fdiv>\n        <ul class=\"s6-list\">\n          <li>~$3,000 per camera per year subscription<\u002Fli>\n          <li>Plus install, mounting, and electrical<\u002Fli>\n          <li>Locked to fixed locations<\u002Fli>\n          <li>Cost grows linearly with coverage<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"s6-arrow\"><div class=\"s6-arrow-inner\">→<\u002Fdiv><\u002Fdiv>\n      <div class=\"s6-card us\">\n        <span class=\"label\">AMBER Angels Pilot<\u002Fspan>\n        <h3>25 active mobile nodes + drone team<\u002Fh3>\n        <div class=\"s6-bar\"><span class=\"num\">$35K<\u002Fspan><span class=\"unit\">/ year, total<\u002Fspan><\u002Fdiv>\n        <ul class=\"s6-list\">\n          <li>Volunteers contribute device + driving time<\u002Fli>\n          <li>No recurring software license fees (open source)<\u002Fli>\n          <li>Coverage moves with daily commute patterns<\u002Fli>\n          <li>Marginal cost per added volunteer ≈ $0<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"s6-foot\"><strong>~53% lower year-one cost<\u002Fstrong> for an order of magnitude more flexible coverage. The asymmetry compounds as the volunteer network grows.<\u002Fp>\n    <div class=\"brand\"><img src=\"2d48698e-c272-46ee-be68-b4d025366d3e\" alt=\"AA\"><span>AMBER <em>Angels<\u002Fem><\u002Fspan><\u002Fdiv>\n    <div class=\"sn\">06 / 14<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── 07 ROI ── -->\n  <section id=\"s7\" data-screen-label=\"07 ROI\">\n    <div class=\"s7-head\"><span class=\"tag\">Grant ROI<\u002Fspan><\u002Fdiv>\n    <h2 style=\"margin-top:24px;\">What every grant dollar <em>actually buys.<\u002Fem><\u002Fh2>\n    <p>Pilot-year projections based on 25 active volunteers × 40 road-miles/node/alert × 12 monthly alerts. Conservative volunteer hour valuation per Independent Sector 2024 ($28.54/hr).<\u002Fp>\n    <div class=\"roi-grid\">\n      <div class=\"roi-card\">\n        <div class=\"roi-num\">~12K<\u002Fdiv>\n        <div class=\"roi-label\">Search miles / year<\u002Fdiv>\n        <div class=\"roi-desc\">Of additional road coverage in active alert events — beyond fixed camera locations.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"roi-card\">\n        <div class=\"roi-num\"><span class=\"small\">$<\u002Fspan>32<\u002Fdiv>\n        <div class=\"roi-label\">Cost per search-mile<\u002Fdiv>\n        <div class=\"roi-desc\">All-in pilot cost ÷ projected coverage. Compares favorably to per-mile patrol cost.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"roi-card\">\n        <div class=\"roi-num\"><span class=\"small\">$<\u002Fspan>171K<\u002Fdiv>\n        <div class=\"roi-label\">In-kind volunteer value<\u002Fdiv>\n        <div class=\"roi-desc\">6,000 volunteer-hours × $28.54 — countable as match on most federal grants.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"roi-card\">\n        <div class=\"roi-num\"><span class=\"small\">&lt;<\u002Fspan>5%<\u002Fdiv>\n        <div class=\"roi-label\">False positive rate<\u002Fdiv>\n        <div class=\"roi-desc\">VMMC dual-verification, vs ~30% for plate-only systems. Higher signal for officers.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"roi-foot\"><strong>Effective leverage:<\u002Fstrong> every $1 of grant funding mobilizes ~$0.44 of in-kind volunteer labor and produces ~38 search-miles of new coverage. The model scales without proportional cost growth.<\u002Fdiv>\n    <div class=\"brand\"><img src=\"2d48698e-c272-46ee-be68-b4d025366d3e\" alt=\"AA\"><span>AMBER <em>Angels<\u002Fem><\u002Fspan><\u002Fdiv>\n    <div class=\"sn\">07 / 14<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── 08 USE OF FUNDS ── -->\n  <section id=\"s8\" data-screen-label=\"08 Use of Funds\" class=\"gridbg\">\n    <div class=\"s8-l\">\n      <span class=\"tag\">Use of Funds<\u002Fspan>\n      <h2 style=\"margin-top:28px;\">Every dollar is <em>mission-direct.<\u002Fem><\u002Fh2>\n      <p>No software licensing fees. No proprietary platform lock-in. We're built on open-source foundations because mission infrastructure should be auditable, transferable, and free to replicate.<\u002Fp>\n      <div class=\"total\">\n        <div class=\"total-label\">12-Month Pilot Budget<\u002Fdiv>\n        <div class=\"total-val\">$385,000<\u002Fdiv>\n        <div class=\"total-period\">All amounts in USD · subject to grant terms<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"s8-r\">\n      <div class=\"s8-row\"><div class=\"pct\">40%<\u002Fdiv><div class=\"info\"><h3>Operations &amp; Personnel<\u002Fh3><p>Part-time program coordinator, volunteer training, background checks, insurance<\u002Fp><\u002Fdiv><div class=\"amt\">$154K<\u002Fdiv><\u002Fdiv>\n      <div class=\"s8-row\"><div class=\"pct\">25%<\u002Fdiv><div class=\"info\"><h3>AI Model Development<\u002Fh3><p>VMMC accuracy improvements, dataset curation, model evaluation infrastructure<\u002Fp><\u002Fdiv><div class=\"amt\">$96K<\u002Fdiv><\u002Fdiv>\n      <div class=\"s8-row\"><div class=\"pct\">20%<\u002Fdiv><div class=\"info\"><h3>Technology Infrastructure<\u002Fh3><p>Cloud compute, mobile app maintenance, DJI SDK integration, security compliance<\u002Fp><\u002Fdiv><div class=\"amt\">$77K<\u002Fdiv><\u002Fdiv>\n      <div class=\"s8-row\"><div class=\"pct\">10%<\u002Fdiv><div class=\"info\"><h3>Public Transparency Reporting<\u002Fh3><p>Quarterly reports on detection accuracy, false positive rates, retention compliance<\u002Fp><\u002Fdiv><div class=\"amt\">$38K<\u002Fdiv><\u002Fdiv>\n      <div class=\"s8-row\"><div class=\"pct\">5%<\u002Fdiv><div class=\"info\"><h3>Administrative Overhead<\u002Fh3><p>Legal, accounting, 501(c)(3) compliance, board governance<\u002Fp><\u002Fdiv><div class=\"amt\">$19K<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"brand\"><img src=\"2d48698e-c272-46ee-be68-b4d025366d3e\" alt=\"AA\"><span>AMBER <em>Angels<\u002Fem><\u002Fspan><\u002Fdiv>\n    <div class=\"sn\">08 / 14<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── 09 PRIVACY ── -->\n  <section id=\"s9\" data-screen-label=\"09 Privacy\">\n    <div class=\"s9-l\">\n      <span class=\"tag\">Privacy First<\u002Fspan>\n      <h2>Saving lives without building a <em>surveillance state.<\u002Fem><\u002Fh2>\n      <p>Privacy is the foundation, not a feature. Every architectural choice begins with: what is the minimum data required for this mission? It's why we can operate where commercial vendors face community pushback.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"s9-r\">\n      <div class=\"priv-card\">\n        <svg viewBox=\"0 0 44 44\" fill=\"none\"><rect x=\"5\" y=\"14\" width=\"24\" height=\"18\" rx=\"3\" stroke=\"#f59e0b\" stroke-width=\"2.2\"><\u002Frect><path d=\"M29 19l9-4v15l-9-4V19z\" stroke=\"#f59e0b\" stroke-width=\"2.2\" stroke-linejoin=\"round\"><\u002Fpath><line x1=\"6\" y1=\"38\" x2=\"38\" y2=\"6\" stroke=\"#ef4444\" stroke-width=\"2.8\" stroke-linecap=\"round\"><\u002Fline><\u002Fsvg>\n        <h3>No video archive<\u002Fh3>\n        <p>Footage is processed in real-time and deleted immediately after AI scoring. No searchable database.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"priv-card\">\n        <svg viewBox=\"0 0 44 44\" fill=\"none\"><circle cx=\"22\" cy=\"22\" r=\"16\" stroke=\"#f59e0b\" stroke-width=\"2.2\"><\u002Fcircle><circle cx=\"22\" cy=\"22\" r=\"8\" stroke=\"#f59e0b\" stroke-width=\"2.2\"><\u002Fcircle><circle cx=\"22\" cy=\"22\" r=\"3\" fill=\"#f59e0b\"><\u002Fcircle><\u002Fsvg>\n        <h3>Operational necessity only<\u002Fh3>\n        <p>Strictly mission-required data is collected. Nothing more. Retention measured in seconds, not days.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"priv-card\">\n        <svg viewBox=\"0 0 44 44\" fill=\"none\"><circle cx=\"22\" cy=\"16\" r=\"6.5\" stroke=\"#f59e0b\" stroke-width=\"2.2\"><\u002Fcircle><path d=\"M9 38c0-7.18 5.82-13 13-13s13 5.82 13 13\" stroke=\"#f59e0b\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M30 24l3 3 5-5\" stroke=\"#22c55e\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <h3>Human in the loop<\u002Fh3>\n        <p>No AI result reaches law enforcement without coordinator review. AI flags. Humans decide.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"priv-card\">\n        <svg viewBox=\"0 0 44 44\" fill=\"none\"><rect x=\"9\" y=\"6\" width=\"26\" height=\"32\" rx=\"3\" stroke=\"#f59e0b\" stroke-width=\"2.2\"><\u002Frect><line x1=\"14\" y1=\"15\" x2=\"30\" y2=\"15\" stroke=\"#f59e0b\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fline><line x1=\"14\" y1=\"22\" x2=\"30\" y2=\"22\" stroke=\"#f59e0b\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fline><line x1=\"14\" y1=\"29\" x2=\"24\" y2=\"29\" stroke=\"#f59e0b\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fline><\u002Fsvg>\n        <h3>Public transparency<\u002Fh3>\n        <p>Quarterly published reports on accuracy, retention, and incident counts. Auditable by design.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"brand\"><img src=\"2d48698e-c272-46ee-be68-b4d025366d3e\" alt=\"AA\"><span>AMBER <em>Angels<\u002Fem><\u002Fspan><\u002Fdiv>\n    <div class=\"sn\">09 / 14<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── 10 TEAM ── -->\n  <section id=\"s10\" data-screen-label=\"10 Team\">\n    <div class=\"s10-head\"><span class=\"tag\">Why Us<\u002Fspan><\u002Fdiv>\n    <h2 style=\"margin-top:24px;\">Mission-critical software needs <em>mission-critical builders.<\u002Fem><\u002Fh2>\n    <div class=\"s10-grid\">\n      <div class=\"s10-bio\">\n        <div class=\"s10-bio-name\">Grant Lindberg<\u002Fdiv>\n        <div class=\"s10-bio-role\">Fou nejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <div><h4>Financial Technology Engineer<\u002Fh4><p>Currently building secure, regulated, audit-grade software systems<\u002Fp><\u002Fdiv>\n          <\u002Fli>\n          <li class=\"s10-cred-item\">\n            <svg width=\"22\" height=\"22\" viewBox=\"0 0 22 22\" fill=\"none\"><circle cx=\"11\" cy=\"11\" r=\"9\" stroke=\"#f59e0b\" stroke-width=\"2\"><\u002Fcircle><path d=\"M7 11l3 3 5-6\" stroke=\"#f59e0b\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <div><h4>1,000+ hours drone flight time<\u002Fh4><p>Working toward Part 107 certification; partnering with certified pilots in the interim<\u002Fp><\u002Fdiv>\n          <\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"s10-org\">\n        <div class=\"s10-org-card\">\n          <div class=\"tag-mini\">Org Status<\u002Fdiv>\n          <h3>501(c)(3) in formation<\u002Fh3>\n          <p>Federal nonprofit application in process. Every grant dollar deductible and mission-restricted. Full board governance and annual public 990 transparency.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"s10-org-card\">\n          <div class=\"tag-mini\">Veteran-led<\u002Fdiv>\n          <h3>SDVOSB founding ethos<\u002Fh3>\n          <p>Built on the operational discipline and service orientation of veteran founders. Active engagement with local veteran volunteer networks.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"s10-org-card\">\n          <div class=\"tag-mini\">Open Source<\u002Fdiv>\n          <h3>No vendor lock-in<\u002Fh3>\n          <p>Stack is auditable, transferable, and replicable. Funders fund mission, not licenses. Future organizations can adopt the playbook.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"brand\"><img src=\"2d48698e-c272-46ee-be68-b4d025366d3e\" alt=\"AA\"><span>AMBER <em>Angels<\u002Fem><\u002Fspan><\u002Fdiv>\n    <div class playbook authored · year-2 county selection · second transparency report · grant renewal package<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"brand\"><img src=\"2d48698e-c272-46ee-be68-b4d025366d3e\" alt=\"AA\"><span>AMBER <em>Angels<\u002Fem><\u002Fspan><\u002Fdiv>\n    <div class=\"sn\">11 / 14<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── 12 SCALE ── -->\n  <section id=\"s12\" data-screen-label=\"12 Scale Vision\">\n    <div class=\"s12-head\"><span class=\"tag\">Multi-Year Vision<\u002Fspan><\u002Fdiv>\n    <h2 style=\"margin-top:24px;\">Public-interest infrastructure that <em>compounds.<\u002Fem><\u002Fh2>\n    <p>Marginal cost per additional volunteer is essentially zero. The funding curve flattens — most year-2 expansion cost is one-time county onboarding, not recurring per-node fees.<\u002Fp>\n    <div class=\"s12-scale\">\n      <div class=\"scale-card y1\">\n        <div class=\"scale-year\">Year 1 · Funded by this ask<\u002Fdiv>\n        <div class=\"scale-headline\">Pilot proof<\u002Fdiv>\n        <div class=\"scale-stat\"><span class=\"big\">1<\u002Fspan><span class=\"small\">county · Carroll, GA<\u002Fspan><\u002Fdiv>\n        <ul class=\"scale-list\">\n          <li>30 active volunteer searchers<\u002Fli>\n          <li>5 Part 107 drone pilots<\u002Fli>\n          <li>Live AMBER Alert response<\u002Fli>\n          <li>First public transparency report<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"scale-card\">\n        <div class=\"scale-year\">Year 2 · Geographic scaling<\u002Fdiv>\n        <div class=\"scale-headline\">Replicate model<\u002Fdiv>\n        <div class=\"scale-stat\"><span class=\"big\">5<\u002Fspan><span class=\"small\">counties · Georgia<\u002Fspan><\u002Fdiv>\n        <ul class=\"scale-list\">\n          <li>Onboarding playbook stabilized<\u002Fli>\n          <li>~150 active volunteers<\u002Fli>\n          <li>Regional coordinator hired<\u002Fli>\n          <li>Federal partnership pathway<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"scale-card\">\n        <div class=\"scale-year\">Year 3 · Multi-state<\u002Fdiv>\n        <div class=\"scale-headline\">Federal pathway<\u002Fdiv>\n        <div class=\"scale-stat\"><span class=\"big\">10<\u002Fspan><span class=\"small\">states · Southeast + national<\u002Fspan><\u002Fdiv>\n        <ul class=\"scale-list\">\n          <li>Coordinator positions per region<\u002Fli>\n          <li>Federal grant baseline established<\u002Fli>\n          <li>~1,000 active volunteers<\u002Fli>\n          <li>Open-source platform widely adopted<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"brand\"><img src=\"2d48698e-c272-46ee-be68-b4d025366d3e\" alt=\"AA\"><span>AMBER <em>Angels<\u002Fem><\u002Fspan><\u002Fdiv>\n    <div class=\"sn\">12 / 14<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── 13 THE ASK ── -->\n  <section id=\"s13\" data-screen-label=\"13 The Ask\">\n    <div class=\"s13-l\">\n      <span class=\"label\">The Ask<\u002Fspan>\n      <div class=\"s13-amt\">$385K<\u002Fdiv>\n      <div class=\"s13-period\">12 months · Carroll County pilot<\u002Fdiv>\n      <p class=\"s13-frame\">Approaching multiple federal, foundation, and corporate funders. Partial funding still moves the mission forward — every dollar is mission-direct and tax-deductible.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"s13-r\">\n      <h2>What your partnership <em>unlocks.<\u002Fem><\u002Fh2>\n      <ul class=\"s13-list\">\n        <li>\n          <svg width=\"28\" height=\"28\" viewBox=\"0 0 28 28\" fill=\"none\"><circle cx=\"14\" cy=\"14\" r=\"12\" stroke=\"#f59e0b\" stroke-width=\"2.2\"><\u002Fcircle><path d=\"M9 14l3.5 3.5L19 10\" stroke=\"#f59e0b\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <div class=\"text\"><strong>Operational pilot<\u002Fstrong> — 30 volunteers + 5 drone pilots covering 503 sq mi of Carroll Coun
