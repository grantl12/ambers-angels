name: Site Stats

on:
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Pull stats from nginx logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 157.245.125.103
          username: ambers-angels
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            echo "===== SITE STATS ====="

            REPORT=$(curl -s -u "amber:Ambers1Angels" http://localhost/analytics/ 2>/dev/null)

            if [ -z "$REPORT" ]; then
              echo "Could not fetch analytics report."
              exit 1
            fi

            echo ""
            echo "Pulling key numbers from GoAccess report..."
            echo ""

            echo "$REPORT" | grep -oP '"visitors":\{"count":\K[0-9]+' | head -1 | xargs -I{} echo "Unique visitors (all time): {}"
            echo "$REPORT" | grep -oP '"requests":\{"count":\K[0-9]+' | head -1 | xargs -I{} echo "Total requests (all time):  {}"
            echo "$REPORT" | grep -oP '"bytes":\{"count":\K[0-9]+' | head -1 | xargs -I{} echo "Bytes transferred:          {}"

            echo ""
            echo "--- Top pages (from report) ---"
            echo "$REPORT" | grep -oP '"data":"(/[^"]*)"' | grep -v '\.(js|css|png|jpg|ico|svg|woff|map)' | head -15 | sed 's/"data":"//;s/"//'

            echo ""
            echo "--- Raw visitor count from GoAccess JSON ---"
            echo "$REPORT" > /tmp/goaccess_report.html
            python3 - <<'PYEOF'
            import json, re
            html = open('/tmp/goaccess_report.html').read()
            m = re.search(r'window\.GoAccess\s*=\s*(\{.*?\});', html, re.DOTALL)
            if not m:
                print('Could not find GoAccess data block')
            else:
                try:
                    data = json.loads(m.group(1))
                    gen = data.get('general', {})
                    print(f'Unique visitors:  {gen.get("unique_visitors", "?")}')
                    print(f'Total requests:   {gen.get("total_requests", "?")}')
                    print(f'Valid requests:   {gen.get("valid_requests", "?")}')
                    print(f'Bandwidth:        {gen.get("bandwidth", "?")}')
                    print(f'Date range:       {gen.get("start_date", "?")} to {gen.get("end_date", "?")}')
                except Exception as e:
                    print(f'Parse error: {e}')
                    print(html[:500])
            PYEOF
            rm -f /tmp/goaccess_report.html
