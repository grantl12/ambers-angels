name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 157.245.125.103
          username: ambers-angels
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd /home/ambers-angels/proj_dir/ambers-angels
            git pull origin main

            # Run DB migrations before restarting anything
            python3 backend/run_migration.py

            # Restart API and worker so new backend code is live
            /home/ambers-angels/.local/bin/pm2 restart ambers-angels-api ambers-angels-worker --update-env

            # Build and restart web
            cd web
            sudo rm -rf .next node_modules
            npm ci --prefer-offline
            npm run build
            ~/.local/bin/pm2 restart ambers-angels-web
