name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 157.245.125.103
          username: ambers-angels
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd /home/ambers-angels/proj_dir/ambers-angels
            git pull origin main
            cd web
            # Heal any root-owned files left by manual plink commands
            sudo chown -R ambers-angels:ambers-angels /home/ambers-angels/proj_dir/ambers-angels/web/.next /home/ambers-angels/proj_dir/ambers-angels/web/node_modules 2>/dev/null || true
            npm ci --prefer-offline
            npm run build
            ~/.local/bin/pm2 restart ambers-angels-web
