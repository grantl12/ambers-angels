name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 157.245.125.103
          username: ambers-angels
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd /home/ambers-angels/proj_dir/ambers-angels
            git pull origin main
            git restore .   # reverse any working-tree deletions so pages can't be rm-rf'd away

            # Ensure PM2 log rotation is installed (idempotent)
            /home/ambers-angels/.local/bin/pm2 list | grep -q pm2-logrotate \
              || /home/ambers-angels/.local/bin/pm2 install pm2-logrotate
            /home/ambers-angels/.local/bin/pm2 set pm2-logrotate:max_size 50M
            /home/ambers-angels/.local/bin/pm2 set pm2-logrotate:retain 7

            # Install/update backend Python deps (idempotent — safe to run every
            # deploy). There's no venv on this box; the API/worker processes run
            # against the ambers-angels user's ~/.local site-packages, so new
            # requirements.txt entries never took effect without this — that's
            # why feedparser/beautifulsoup4/spacy silently never installed after
            # the BOLO crawler was added, leaving it fetching nothing forever.
            pip3 install --user -q -r backend/requirements.txt

            # Run DB migrations (idempotent — safe to run every deploy)
            python3 backend/run_migration.py

            # Stop web process before cleaning — prevents PM2 auto-restart from
            # racing next build and triggering "another build already running" error
            ~/.local/bin/pm2 stop ambers-angels-web || true

            # Rebuild frontend — chown first in case root ever built directly.
            # sudo uses absolute paths; relative paths don't match sudoers entries.
            WEBDIR=/home/ambers-angels/proj_dir/ambers-angels/web
            cd web
            sudo chown -R ambers-angels:ambers-angels "$WEBDIR/.next" 2>/dev/null || true
            sudo chown -R ambers-angels:ambers-angels "$WEBDIR/node_modules" 2>/dev/null || true
            rm -rf .next node_modules
            npm ci --prefer-offline
            npm run build
            cd ..

            # Start rtmp-monitor if not already registered, then restart all
            ~/.local/bin/pm2 describe ambers-angels-rtmp-monitor > /dev/null 2>&1 \
              || ~/.local/bin/pm2 start worker/rtmp_monitor.py \
                   --name ambers-angels-rtmp-monitor \
                   --interpreter python3

            # Restart all four processes with fresh env
            ~/.local/bin/pm2 restart ambers-angels-web ambers-angels-api ambers-angels-worker ambers-angels-rtmp-monitor --update-env
