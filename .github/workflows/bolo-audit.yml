name: BOLO Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Query BOLO data from DB and logs
        uses: appleboy/ssh-action@v1.0.3
        env:
          SUDO_PW: ${{ secrets.AMBERS_ANGELS_SUDO_PW }}
        with:
          host: 157.245.125.103
          username: ambers-angels
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command_timeout: 30s
          envs: SUDO_PW
          script: |
            echo "===== BOLO AUDIT — $(date -u) ====="

            Q() { echo "$SUDO_PW" | sudo -S -u postgres psql -d ambersangels -t -A -c "$1" 2>/dev/null; }

            echo ""
            echo "=== 1. Recent BOLO entries in processed_alerts ==="
            Q "SELECT identifier, processed_at FROM processed_alerts WHERE identifier LIKE 'bolo%' ORDER BY processed_at DESC LIMIT 10;"

            echo ""
            echo "=== 2. Recent BOLO watchlist entries ==="
            Q "SELECT plate_text, description, alert_type, source_program, vehicle_color, vehicle_type, vehicle_make, active, added_at FROM watchlist WHERE source_program ILIKE '%bolo%' OR source_program ILIKE '%manual%' OR alert_type = 'bolo' ORDER BY added_at DESC LIMIT 10;"

            echo ""
            echo "=== 3. Recent BOLO vehicle_targets ==="
            Q "SELECT id, fema_identifier, alert_type, source_program, headline, area, color, body_type, make, expires_at, created_at FROM vehicle_targets WHERE source_program ILIKE '%bolo%' OR source_program ILIKE '%manual%' OR alert_type = 'bolo' ORDER BY created_at DESC LIMIT 10;"

            echo ""
            echo "=== 4. All source_program values in use ==="
            Q "SELECT source_program, COUNT(*) FROM watchlist GROUP BY source_program ORDER BY count DESC;"
            echo "---"
            Q "SELECT source_program, COUNT(*) FROM vehicle_targets GROUP BY source_program ORDER BY count DESC;"

            echo ""
            echo "=== 5. All alert_type values in use ==="
            Q "SELECT alert_type, COUNT(*) FROM watchlist GROUP BY alert_type ORDER BY count DESC;"
            echo "---"
            Q "SELECT alert_type, COUNT(*) FROM vehicle_targets GROUP BY alert_type ORDER BY count DESC;"

            echo ""
            echo "=== 6. bolo_sources table ==="
            Q "SELECT id, name, source_type, state, active, last_crawled_at FROM bolo_sources ORDER BY id;" || echo "(table does not exist)"

            echo ""
            echo "=== 7. PM2 logs — BOLO mentions (last 500 lines) ==="
            tail -n 500 /home/ambers-angels/.pm2/logs/ambers-angels-api-out.log 2>/dev/null | grep -i 'bolo' || echo "(no bolo mentions in recent API logs)"

            echo ""
            echo "=== 8. PM2 logs — BOLO worker mentions ==="
            tail -n 500 /home/ambers-angels/.pm2/logs/ambers-angels-worker-out.log 2>/dev/null | grep -i 'bolo' || echo "(no bolo mentions in recent worker logs)"

            echo ""
            echo "=== 9. Most recent manual/demo entries for context ==="
            Q "SELECT plate_text, description, alert_type, source_program, vehicle_color, vehicle_type, vehicle_make, active, added_at FROM watchlist WHERE source_program IN ('manual','demo','Manual Inject') ORDER BY added_at DESC LIMIT 5;"

            echo ""
            echo "=== 10. NamUs cases (if any) ==="
            Q "SELECT namus_id, subject_name, state, actionable, alert_type, vehicle_info, first_seen_at FROM namus_cases WHERE actionable = true ORDER BY first_seen_at DESC LIMIT 5;" || echo "(table does not exist)"

            echo ""
            echo "=== 11. ALL watchlist entries (most recent 10) ==="
            Q "SELECT plate_text, description, alert_type, source_program, vehicle_color, vehicle_type, vehicle_make, active, added_at FROM watchlist ORDER BY added_at DESC LIMIT 10;"

            echo ""
            echo "=== 12. ALL vehicle_targets (most recent 10) ==="
            Q "SELECT id, fema_identifier, alert_type, source_program, headline, area, color, body_type, make, expires_at, created_at FROM vehicle_targets ORDER BY created_at DESC LIMIT 10;"
