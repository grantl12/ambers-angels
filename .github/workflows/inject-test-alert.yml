name: Inject Test Alert

on:
  workflow_dispatch:
    inputs:
      plate:
        description: "License plate"
        required: true
        default: "YVJ024"
      vehicle_color:
        description: "Vehicle color"
        required: true
        default: "white"
      vehicle_make:
        description: "Vehicle make"
        required: true
        default: "Tesla"
      vehicle_type:
        description: "Vehicle body type (car/truck/suv/motorcycle)"
        required: true
        default: "car"
      area:
        description: "Alert area description"
        required: true
        default: "Carrollton, GA"
      headline:
        description: "Alert headline"
        required: true
        default: "TEST - System verification"

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Inject test alert via server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 157.245.125.103
          username: ambers-angels
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd /home/ambers-angels/proj_dir/ambers-angels

            python3 - <<'PYEOF'
            import os, sys, json, hashlib, httpx
            from datetime import datetime, timezone

            # Load .env
            env = {}
            with open(".env") as f:
                for line in f:
                    line = line.strip()
                    if line and not line.startswith("#") and "=" in line:
                        k, _, v = line.partition("=")
                        env[k.strip()] = v.strip().strip('"').strip("'")

            PLATE      = "${{ github.event.inputs.plate }}".upper()
            COLOR      = "${{ github.event.inputs.vehicle_color }}"
            MAKE       = "${{ github.event.inputs.vehicle_make }}"
            VTYPE      = "${{ github.event.inputs.vehicle_type }}"
            AREA       = "${{ github.event.inputs.area }}"
            HEADLINE   = "${{ github.event.inputs.headline }}"
            WEBHOOK    = env.get("ALERT_WEBHOOK_URL", "")
            DB_URL     = env.get("DATABASE_URL", "")

            import subprocess, textwrap

            # Use psql to insert watchlist + vehicle_targets entries
            psql_cmd = ["psql", "-h", "127.0.0.1", "-U", "postgres", "ambersangels"]
            env_with_pw = {**os.environ, "PGPASSWORD": "${{ secrets.POSTGRES_PASSWORD }}"}

            FEMA_ID = f"manual-test-{PLATE}"
            sql = textwrap.dedent(f"""
                INSERT INTO watchlist (plate_text, description, alert_type, source_program, vehicle_color, vehicle_type, vehicle_make, active, added_at)
                VALUES ('{PLATE}', '{HEADLINE} [ID: {FEMA_ID}]', 'amber', 'Manual Test', '{COLOR}', '{VTYPE}', '{MAKE}', true, NOW())
                ON CONFLICT (plate_text) DO UPDATE SET active = true, description = EXCLUDED.description;

                INSERT INTO vehicle_targets (fema_identifier, alert_type, source_program, headline, area, color, body_type, make)
                VALUES ('{FEMA_ID}', 'amber', 'Manual Test', '{HEADLINE}', '{AREA}', '{COLOR}', '{VTYPE}', '{MAKE}')
                ON CONFLICT (fema_identifier) DO UPDATE SET headline = EXCLUDED.headline, area = EXCLUDED.area;
            """)

            result = subprocess.run(psql_cmd, input=sql, capture_output=True, text=True, env=env_with_pw)
            if result.returncode != 0:
                print("psql error:", result.stderr)
                sys.exit(1)
            print("DB entries created.")

            # Send Expo push notifications to all eligible pilots
            push_sql = """
                SELECT expo_push_token, watch_areas, alert_scope
                FROM pilots
                WHERE status = 'approved'
                  AND expo_push_token IS NOT NULL
                  AND expo_push_token != ''
            """
            rows_result = subprocess.run(
                psql_cmd + ["-t", "-A", "-F", "\t", "-c", push_sql],
                capture_output=True, text=True, env=env_with_pw
            )
            tokens = []
            for row in rows_result.stdout.strip().splitlines():
                parts = row.split("\t")
                if not parts or not parts[0]:
                    continue
                token       = parts[0].strip()
                alert_scope = parts[2].strip() if len(parts) > 2 else ""
                watch_areas = parts[1].strip() if len(parts) > 1 else "[]"
                # Nationwide pilots always get it; area-scoped pilots get it if area matches
                if alert_scope == "nationwide" or not watch_areas or watch_areas == "[]":
                    tokens.append(token)
                else:
                    import json as _json
                    areas = _json.loads(watch_areas) if watch_areas else []
                    if any(AREA.lower() in a.lower() or a.lower() in AREA.lower() for a in areas):
                        tokens.append(token)

            if tokens:
                push_payload = [
                    {
                        "to":    token,
                        "title": f"🚨 TEST ALERT — {PLATE}",
                        "body":  f"{COLOR} {MAKE} · {AREA}",
                        "sound": "default",
                        "data":  {"alertType": "amber", "area": AREA},
                        "priority": "high",
                    }
                    for token in tokens
                ]
                pr = httpx.post(
                    "https://exp.host/--/api/v2/push/send",
                    json=push_payload,
                    headers={"Accept": "application/json", "Content-Type": "application/json"},
                    timeout=15,
                )
                print(f"Expo push: {pr.status_code} — {len(tokens)} token(s)")
            else:
                print("No eligible push tokens found.")

            # Fire Discord notification
            if WEBHOOK:
                color_int = 0xF59E0B  # amber
                payload = {
                    "embeds": [{
                        "title": f"🚨 TEST ALERT — {PLATE}",
                        "description": HEADLINE,
                        "color": color_int,
                        "fields": [
                            {"name": "Plate",   "value": f"`{PLATE}`",          "inline": True},
                            {"name": "Vehicle", "value": f"{COLOR} {MAKE} ({VTYPE})", "inline": True},
                            {"name": "Area",    "value": AREA,                  "inline": False},
                            {"name": "Source",  "value": "Manual Test Inject",  "inline": True},
                        ],
                        "footer": {"text": "Amber's Angels — Test Injection"},
                        "timestamp": datetime.now(timezone.utc).isoformat(),
                    }]
                }
                r = httpx.post(WEBHOOK, json=payload, timeout=10)
                print(f"Discord: {r.status_code}")
            else:
                print("No webhook configured — skipping Discord.")

            print(f"Done. Plate {PLATE} is now active on the watchlist.")
            PYEOF
