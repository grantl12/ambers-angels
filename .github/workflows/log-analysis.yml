name: Nginx Log Analysis

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and analyze nginx logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 157.245.125.103
          username: ambers-angels
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            DATE=$(date -d yesterday +"%d/%b/%Y")
            LOGS="/var/log/nginx/access.log /var/log/nginx/access.log.1"

            echo "====== DATE: $DATE ======"

            DAYLOG=$(cat $LOGS 2>/dev/null | grep "$DATE")

            if [ -z "$DAYLOG" ]; then
              echo "No log entries found for $DATE"
              echo "Dates in current logs:"
              cat $LOGS 2>/dev/null | grep -oP '\d{2}/\w{3}/\d{4}' | sort -u | tail -5
              exit 0
            fi

            echo ""
            echo "=== TOTAL RAW REQUESTS ==="
            echo "$DAYLOG" | wc -l

            echo ""
            echo "=== UNIQUE IPs (all) ==="
            echo "$DAYLOG" | awk '{print $1}' | sort -u | wc -l

            echo ""
            echo "=== UNIQUE IPs (filtered — no bots, no assets, no health checks) ==="
            echo "$DAYLOG" | grep -viE 'bot|spider|crawl|curl|wget|python|java|Go-http|node-fetch|okhttp|UptimeRobot|pingdom|datadog|GTmetrix|lighthouse|pagespeed|facebookexternalhit|Twitterbot|LinkedInBot|Slackbot|Discordbot|WhatsApp|Googlebot|bingbot|yandex|baidu|DuckDuck|Semrush|ahrefs|mj12|dotbot' | grep -vE '/rtmp-stat|/_next/static|/favicon|/robots\.txt|/SDK/|\.env|wp-admin' | awk '{if ($9 != "400") print $1}' | sort -u | wc -l

            echo ""
            echo "=== HUMAN REQUESTS (bots filtered) ==="
            echo "$DAYLOG" | grep -viE 'bot|spider|crawl|curl|wget|python|java|Go-http|node-fetch|okhttp|UptimeRobot|pingdom|datadog|GTmetrix|lighthouse|pagespeed|facebookexternalhit|Twitterbot|LinkedInBot|Slackbot|Discordbot|WhatsApp|Googlebot|bingbot|yandex|baidu|DuckDuck|Semrush|ahrefs|mj12|dotbot' | wc -l

            echo ""
            echo "=== UNIQUE HUMAN IPs ==="
            echo "$DAYLOG" | grep -viE 'bot|spider|crawl|curl|wget|python|java|Go-http|node-fetch|okhttp|UptimeRobot|pingdom|datadog|GTmetrix|lighthouse|pagespeed|facebookexternalhit|Twitterbot|LinkedInBot|Slackbot|Discordbot|WhatsApp|Googlebot|bingbot|yandex|baidu|DuckDuck|Semrush|ahrefs|mj12|dotbot' | awk '{print $1}' | sort -u | wc -l

            echo ""
            echo "=== TOP PAGES (human, no assets) ==="
            echo "$DAYLOG" | grep -viE 'bot|spider|crawl|curl|wget|python|java|Go-http|node-fetch|okhttp|UptimeRobot|pingdom|Googlebot|bingbot|Semrush|ahrefs' | awk '{print $7}' | sed 's/?.*$//' | grep -vE '/_next/|/api/|/health|/frames/|\.ico$|\.png$|\.jpg$|\.svg$|\.woff|\.css$|\.js$|/rtmp-stat|/analytics' | sort | uniq -c | sort -rn | head -25

            echo ""
            echo "=== TOP REFERRERS (external only) ==="
            echo "$DAYLOG" | grep -viE 'bot|spider|crawl|Googlebot|bingbot' | awk '{print $11}' | grep -v '^"-"$' | grep -viE 'amberangels\.org|157\.245\.125\.103' | sort | uniq -c | sort -rn | head -15

            echo ""
            echo "=== TRAFFIC BY HOUR ==="
            echo "$DAYLOG" | grep -viE 'bot|spider|crawl|curl|wget|python|Go-http|UptimeRobot|Googlebot|bingbot' | grep -oP '\d{2}/\w+/\d{4}:\d{2}' | awk -F: '{print $2":00"}' | sort | uniq -c

            echo ""
            echo "=== HTTP STATUS CODES ==="
            echo "$DAYLOG" | awk '{print $9}' | sort | uniq -c | sort -rn

            echo ""
            echo "=== BLOG PAGE HITS ==="
            echo "$DAYLOG" | grep -i '/blog' | grep -viE 'bot|spider|crawl|Googlebot|bingbot|Semrush|ahrefs' | awk '{print $7}' | sed 's/?.*$//' | sort | uniq -c | sort -rn

            echo ""
            echo "=== DECK PAGE HITS ==="
            echo "$DAYLOG" | grep '/deck' | grep -viE 'bot|spider|crawl|Googlebot|bingbot|Semrush|ahrefs' | awk '{print $7}' | sed 's/?.*$//' | sort | uniq -c | sort -rn

            echo ""
            echo "=== DEVICES (OS from UA) ==="
            echo "$DAYLOG" | grep -viE 'bot|spider|crawl|curl|wget|python|Go-http' | grep -oiP '(iPhone|iPad|Android|Windows NT|Macintosh|Linux(?! .*(Android|bot)))' | sort | uniq -c | sort -rn
