<svg xmlns="http://www.w3.org/2000/svg" width="700" height="960" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="700" height="960" fill="#050a0f"/>

  <!-- Title -->
  <text x="350" y="38" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="1">How to Start a Mission</text>
  <line x1="40" y1="50" x2="660" y2="50" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>

  <!-- Connector line down the left -->
  <line x1="56" y1="80" x2="56" y2="900" stroke="rgba(167,139,250,0.2)" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- ===== STEP 1 ===== -->
  <circle cx="56" cy="96" r="18" fill="#a78bfa" stroke="#050a0f" stroke-width="3"/>
  <text x="56" y="101" text-anchor="middle" fill="#050a0f" font-size="14" font-weight="800">1</text>
  <text x="90" y="92" fill="#a78bfa" font-size="14" font-weight="700" letter-spacing="1">SETTINGS → VOLUNTEER MODE</text>
  <text x="90" y="109" fill="rgba(255,255,255,0.5)" font-size="11">Choose how you're participating in the mission</text>

  <!-- Phone mockup 1 -->
  <rect x="90" y="122" width="200" height="120" fill="#0d1117" rx="12" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="100" y="132" width="180" height="100" fill="#111827" rx="8"/>
  <!-- Mode buttons inside mockup -->
  <text x="190" y="150" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="9" font-weight="700" letter-spacing="2">VOLUNTEER MODE</text>
  <!-- Phone mode button (active) -->
  <rect x="108" y="158" width="52" height="28" fill="rgba(245,158,11,0.15)" rx="6" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="134" y="176" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="700">📱 Phone</text>
  <!-- Drone button -->
  <rect x="164" y="158" width="52" height="28" fill="rgba(255,255,255,0.04)" rx="6" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="190" y="176" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="10">🚁 Drone</text>
  <!-- Both button -->
  <rect x="220" y="158" width="52" height="28" fill="rgba(255,255,255,0.04)" rx="6" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="246" y="176" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="10">📱+🚁 Both</text>
  <!-- Annotation arrow + text -->
  <line x1="295" y1="182" x2="330" y2="182" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="335" y="178" fill="rgba(255,255,255,0.7)" font-size="11">Pick Phone, Drone,</text>
  <text x="335" y="192" fill="rgba(255,255,255,0.7)" font-size="11">or Both</text>

  <!-- ===== STEP 2 ===== -->
  <circle cx="56" cy="272" r="18" fill="#a78bfa" stroke="#050a0f" stroke-width="3"/>
  <text x="56" y="277" text-anchor="middle" fill="#050a0f" font-size="14" font-weight="800">2</text>
  <text x="90" y="268" fill="#a78bfa" font-size="14" font-weight="700" letter-spacing="1">SET YOUR IDENTITY</text>
  <text x="90" y="285" fill="rgba(255,255,255,0.5)" font-size="11">Your Device ID is your dot on the mission map</text>

  <!-- Phone mockup 2 -->
  <rect x="90" y="298" width="200" height="120" fill="#0d1117" rx="12" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="100" y="308" width="180" height="100" fill="#111827" rx="8"/>
  <text x="190" y="326" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="9" font-weight="700" letter-spacing="2">IDENTITY</text>
  <!-- Device ID field -->
  <text x="108" y="344" fill="rgba(255,255,255,0.4)" font-size="9">Device ID</text>
  <rect x="108" y="348" width="164" height="22" fill="rgba(255,255,255,0.07)" rx="4" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="116" y="363" fill="#ffffff" font-size="11">drone-1</text>
  <!-- Callsign field -->
  <text x="108" y="382" fill="rgba(255,255,255,0.4)" font-size="9">Callsign / name</text>
  <rect x="108" y="386" width="164" height="22" fill="rgba(255,255,255,0.07)" rx="4" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="116" y="401" fill="rgba(255,255,255,0.5)" font-size="11">optional</text>

  <line x1="295" y1="358" x2="330" y2="358" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="335" y="354" fill="rgba(255,255,255,0.7)" font-size="11">Shown to coordinators</text>
  <text x="335" y="368" fill="rgba(255,255,255,0.7)" font-size="11">and on the live map</text>

  <!-- ===== STEP 3 ===== -->
  <circle cx="56" cy="444" r="18" fill="#a78bfa" stroke="#050a0f" stroke-width="3"/>
  <text x="56" y="449" text-anchor="middle" fill="#050a0f" font-size="14" font-weight="800">3</text>
  <text x="90" y="440" fill="#a78bfa" font-size="14" font-weight="700" letter-spacing="1">SET CAPTURE INTERVAL</text>
  <text x="90" y="457" fill="rgba(255,255,255,0.5)" font-size="11">How often frames are sent to the server for analysis</text>

  <!-- Phone mockup 3 -->
  <rect x="90" y="470" width="200" height="100" fill="#0d1117" rx="12" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="100" y="480" width="180" height="80" fill="#111827" rx="8"/>
  <text x="190" y="498" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="9" font-weight="700" letter-spacing="2">CAPTURE</text>
  <text x="108" y="516" fill="rgba(255,255,255,0.4)" font-size="9">Frame interval (seconds)</text>
  <rect x="108" y="520" width="164" height="26" fill="rgba(255,255,255,0.07)" rx="4" stroke="rgba(56,189,248,0.4)" stroke-width="1.5"/>
  <text x="116" y="538" fill="#38bdf8" font-size="14" font-weight="700">5</text>
  <text x="108" y="556" fill="rgba(255,255,255,0.25)" font-size="9">Recommended: 3–10 seconds</text>

  <!-- Battery/data tradeoff visual -->
  <rect x="315" y="476" width="340" height="84" fill="rgba(255,255,255,0.03)" rx="6" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="485" y="494" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="10" font-weight="700" letter-spacing="1">TRADEOFF</text>
  <text x="325" y="514" fill="#22c55e" font-size="11">↓ 3 sec</text>
  <text x="373" y="514" fill="rgba(255,255,255,0.5)" font-size="11">— more detections, more battery + data</text>
  <text x="325" y="533" fill="#f59e0b" font-size="11">↑ 10 sec</text>
  <text x="378" y="533" fill="rgba(255,255,255,0.5)" font-size="11">— fewer hits, longer flight time</text>
  <text x="325" y="552" fill="#38bdf8" font-size="11">✓ 5 sec</text>
  <text x="363" y="552" fill="rgba(255,255,255,0.5)" font-size="11">— default sweet spot</text>

  <!-- ===== STEP 4 ===== -->
  <circle cx="56" cy="594" r="18" fill="#a78bfa" stroke="#050a0f" stroke-width="3"/>
  <text x="56" y="599" text-anchor="middle" fill="#050a0f" font-size="14" font-weight="800">4</text>
  <text x="90" y="590" fill="#a78bfa" font-size="14" font-weight="700" letter-spacing="1">SAVE AND SWITCH TO CAMERA</text>
  <text x="90" y="607" fill="rgba(255,255,255,0.5)" font-size="11">Settings persist across restarts via device storage</text>

  <!-- Phone mockup 4 -->
  <rect x="90" y="620" width="200" height="80" fill="#0d1117" rx="12" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="100" y="630" width="180" height="60" fill="#111827" rx="8"/>
  <rect x="116" y="644" width="148" height="32" fill="rgba(34,197,94,0.12)" rx="6" stroke="rgba(34,197,94,0.35)" stroke-width="1"/>
  <text x="190" y="665" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="700">Saved!</text>

  <line x1="295" y1="660" x2="330" y2="660" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="335" y="656" fill="rgba(255,255,255,0.7)" font-size="11">Then tap the Camera</text>
  <text x="335" y="670" fill="rgba(255,255,255,0.7)" font-size="11">tab at the bottom</text>

  <!-- ===== STEP 5 ===== -->
  <circle cx="56" cy="734" r="18" fill="#22c55e" stroke="#050a0f" stroke-width="3"/>
  <text x="56" y="739" text-anchor="middle" fill="#050a0f" font-size="14" font-weight="800">5</text>
  <text x="90" y="730" fill="#22c55e" font-size="14" font-weight="700" letter-spacing="1">TAP START MISSION</text>
  <text x="90" y="747" fill="rgba(255,255,255,0.5)" font-size="11">Green button goes red — you are live</text>

  <!-- Phone mockup 5 — camera screen with HUD -->
  <rect x="90" y="760" width="200" height="140" fill="#000000" rx="12" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Camera view (dark green tint) -->
  <rect x="100" y="770" width="180" height="120" fill="#0a1a0a" rx="8"/>
  <!-- HUD overlay -->
  <rect x="108" y="778" width="100" height="52" fill="rgba(0,0,0,0.6)" rx="6"/>
  <circle cx="120" cy="790" r="5" fill="#22c55e"/>
  <text x="130" y="794" fill="#ffffff" font-size="9" font-weight="700" letter-spacing="2">LIVE</text>
  <text x="112" y="808" fill="rgba(255,255,255,0.5)" font-size="8">drone-1 · every 5s  🚁</text>
  <text x="112" y="820" fill="#22c55e" font-size="8">DJI connected</text>
  <text x="112" y="832" fill="rgba(255,255,255,0.5)" font-size="8">12 frames sent</text>
  <!-- Stop button -->
  <rect x="128" y="852" width="104" height="28" fill="#ef4444" rx="8"/>
  <text x="180" y="870" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="800">STOP MISSION</text>

  <line x1="295" y1="800" x2="330" y2="800" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="335" y="796" fill="rgba(255,255,255,0.7)" font-size="11">Green dot = uploading</text>
  <text x="335" y="810" fill="rgba(255,255,255,0.7)" font-size="11">Frame count updates live</text>
  <text x="335" y="824" fill="rgba(255,255,255,0.7)" font-size="11">Button turns red → STOP</text>

  <!-- Android background note -->
  <rect x="40" y="916" width="620" height="36" fill="rgba(56,189,248,0.06)" rx="8" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>
  <text x="350" y="930" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">Android only:</text>
  <text x="350" y="945" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="11">Once scanning starts, you can switch to Maps or Uber — frames keep uploading in the background.</text>
</svg>
