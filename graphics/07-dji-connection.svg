<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="800" height="620" fill="#050a0f"/>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Connecting Your DJI Drone</text>
  <line x1="40" y1="46" x2="760" y2="46" stroke="rgba(167,139,250,0.4)" stroke-width="1"/>

  <!-- Step layout: 2x2 grid with connector arrows -->

  <!-- ===== STEP 1 (top-left) ===== -->
  <rect x="40" y="60" width="340" height="220" fill="rgba(167,139,250,0.04)" rx="10" stroke="rgba(167,139,250,0.15)" stroke-width="1"/>
  <circle cx="70" cy="86" r="16" fill="#a78bfa"/>
  <text x="70" y="91" text-anchor="middle" fill="#050a0f" font-size="13" font-weight="800">1</text>
  <text x="100" y="84" fill="#a78bfa" font-size="13" font-weight="700">Power on — wait for GPS lock</text>
  <text x="100" y="99" fill="rgba(255,255,255,0.4)" font-size="11">Drone + remote controller + phone</text>

  <!-- Drone top-down diagram -->
  <!-- Drone body -->
  <rect x="170" y="120" width="40" height="24" fill="#1e293b" rx="4" stroke="#a78bfa" stroke-width="1.5"/>
  <circle cx="190" cy="132" r="6" fill="#a78bfa" opacity="0.7"/>
  <!-- Arms -->
  <line x1="170" y1="126" x2="140" y2="108" stroke="#a78bfa" stroke-width="2"/>
  <line x1="210" y1="126" x2="240" y2="108" stroke="#a78bfa" stroke-width="2"/>
  <line x1="170" y1="138" x2="140" y2="156" stroke="#a78bfa" stroke-width="2"/>
  <line x1="210" y1="138" x2="240" y2="156" stroke="#a78bfa" stroke-width="2"/>
  <!-- Propellers -->
  <ellipse cx="136" cy="106" rx="16" ry="5" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="244" cy="106" rx="16" ry="5" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="136" cy="158" rx="16" ry="5" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="244" cy="158" rx="16" ry="5" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.5"/>

  <!-- GPS satellites -->
  <circle cx="140" cy="86" r="5" fill="#22c55e" opacity="0.8"/>
  <line x1="140" y1="91" x2="155" y2="104" stroke="rgba(34,197,94,0.4)" stroke-width="1" stroke-dasharray="3,2"/>
  <circle cx="220" cy="80" r="5" fill="#22c55e" opacity="0.8"/>
  <line x1="220" y1="85" x2="200" y2="110" stroke="rgba(34,197,94,0.4)" stroke-width="1" stroke-dasharray="3,2"/>
  <circle cx="258" cy="90" r="5" fill="#22c55e" opacity="0.8"/>
  <line x1="255" y1="95" x2="235" y2="110" stroke="rgba(34,197,94,0.4)" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- GPS signal bars (3 solid = good lock) -->
  <rect x="135" y="190" width="8" height="16" fill="#22c55e" rx="1"/>
  <rect x="147" y="184" width="8" height="22" fill="#22c55e" rx="1"/>
  <rect x="159" y="178" width="8" height="28" fill="#22c55e" rx="1"/>
  <text x="190" y="196" fill="rgba(255,255,255,0.5)" font-size="10">GPS signal bars</text>
  <rect x="225" y="188" width="80" height="16" fill="rgba(34,197,94,0.1)" rx="4" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
  <text x="265" y="200" text-anchor="middle" fill="#22c55e" font-size="10" font-weight="600">solid green = locked</text>

  <text x="60" y="242" fill="rgba(255,255,255,0.5)" font-size="11">Wait for solid green GPS on remote before</text>
  <text x="60" y="257" fill="rgba(255,255,255,0.5)" font-size="11">connecting to the app.</text>
  <text x="60" y="272" fill="rgba(255,255,255,0.3)" font-size="10">Tip: fly in open sky away from buildings for best lock.</text>

  <!-- Arrow right 1→2 -->
  <line x1="390" y1="170" x2="420" y2="170" stroke="#a78bfa" stroke-width="2"/>
  <polygon points="420,164 432,170 420,176" fill="#a78bfa"/>

  <!-- ===== STEP 2 (top-right) ===== -->
  <rect x="436" y="60" width="324" height="220" fill="rgba(167,139,250,0.04)" rx="10" stroke="rgba(167,139,250,0.15)" stroke-width="1"/>
  <circle cx="466" cy="86" r="16" fill="#a78bfa"/>
  <text x="466" y="91" text-anchor="middle" fill="#050a0f" font-size="13" font-weight="800">2</text>
  <text x="496" y="84" fill="#a78bfa" font-size="13" font-weight="700">Settings → Volunteer Mode</text>
  <text x="496" y="99" fill="rgba(255,255,255,0.4)" font-size="11">Select Drone or Both</text>

  <!-- Phone mockup — settings mode selector -->
  <rect x="480" y="114" width="240" height="140" fill="#0d1117" rx="10" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="490" y="124" width="220" height="120" fill="#111827" rx="6"/>
  <text x="600" y="142" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="9" font-weight="700" letter-spacing="2">VOLUNTEER MODE</text>
  <!-- Phone button -->
  <rect x="498" y="150" width="64" height="28" fill="rgba(255,255,255,0.04)" rx="5" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="530" y="168" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="10">📱 Phone</text>
  <!-- Drone button (active) -->
  <rect x="566" y="150" width="64" height="28" fill="rgba(245,158,11,0.15)" rx="5" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="598" y="168" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="700">🚁 Drone</text>
  <!-- Both button -->
  <rect x="634" y="150" width="64" height="28" fill="rgba(255,255,255,0.04)" rx="5" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="666" y="168" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="10">📱+🚁</text>
  <!-- DJI key hint -->
  <rect x="498" y="192" width="204" height="22" fill="rgba(255,255,255,0.03)" rx="4" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="600" y="207" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="9">DJI app key set in .env before build</text>

  <!-- Arrow down 2→4 (right side) -->
  <line x1="598" y1="290" x2="598" y2="320" stroke="#a78bfa" stroke-width="2"/>
  <polygon points="592,320 598,332 604,320" fill="#a78bfa"/>

  <!-- Arrow down 1→3 (left side) -->
  <line x1="210" y1="290" x2="210" y2="320" stroke="#a78bfa" stroke-width="2"/>
  <polygon points="204,320 210,332 216,320" fill="#a78bfa"/>

  <!-- ===== STEP 3 (bottom-left) ===== -->
  <rect x="40" y="334" width="340" height="200" fill="rgba(167,139,250,0.04)" rx="10" stroke="rgba(167,139,250,0.15)" stroke-width="1"/>
  <circle cx="70" cy="360" r="16" fill="#a78bfa"/>
  <text x="70" y="365" text-anchor="middle" fill="#050a0f" font-size="13" font-weight="800">3</text>
  <text x="100" y="358" fill="#a78bfa" font-size="13" font-weight="700">Camera screen — check HUD</text>
  <text x="100" y="373" fill="rgba(255,255,255,0.4)" font-size="11">Watch for the DJI status indicator</text>

  <!-- Phone mockup — camera HUD -->
  <rect x="60" y="386" width="190" height="120" fill="#000" rx="10" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="68" y="394" width="174" height="104" fill="#0a1a0a" rx="6"/>
  <!-- HUD box -->
  <rect x="76" y="402" width="130" height="72" fill="rgba(0,0,0,0.65)" rx="6"/>
  <circle cx="90" cy="414" r="5" fill="#ef4444"/>
  <text x="100" y="418" fill="#ffffff" font-size="8" font-weight="700" letter-spacing="2">STANDBY</text>
  <text x="80" y="432" fill="rgba(255,255,255,0.4)" font-size="8">drone-1 · every 5s  🚁</text>
  <!-- DJI status — connected (green) -->
  <text x="80" y="447" fill="#22c55e" font-size="9" font-weight="600">DJI connected ✓</text>
  <text x="80" y="462" fill="rgba(255,255,255,0.3)" font-size="8">SDK initialized</text>
  <!-- Start button -->
  <rect x="110" y="472" width="92" height="20" fill="#22c55e" rx="6"/>
  <text x="156" y="485" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">START MISSION</text>

  <!-- DJI not connected note -->
  <rect x="60" y="475" width="260" height="24" fill="rgba(239,68,68,0.07)" rx="5" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
  <text x="190" y="491" text-anchor="middle" fill="rgba(239,68,68,0.8)" font-size="10">If red: check DJI app key + relaunch app</text>

  <!-- Arrow right 3→4 -->
  <line x1="390" y1="434" x2="420" y2="434" stroke="#a78bfa" stroke-width="2"/>
  <polygon points="420,428 432,434 420,440" fill="#a78bfa"/>

  <!-- ===== STEP 4 (bottom-right) ===== -->
  <rect x="436" y="334" width="324" height="200" fill="rgba(34,197,94,0.04)" rx="10" stroke="rgba(34,197,94,0.15)" stroke-width="1"/>
  <circle cx="466" cy="360" r="16" fill="#22c55e"/>
  <text x="466" y="365" text-anchor="middle" fill="#050a0f" font-size="13" font-weight="800">4</text>
  <text x="496" y="358" fill="#22c55e" font-size="13" font-weight="700">START MISSION — live</text>
  <text x="496" y="373" fill="rgba(255,255,255,0.4)" font-size="11">Drone frames upload automatically</text>

  <!-- Drone in flight illustration -->
  <!-- Drone (small) -->
  <rect x="490" y="390" width="28" height="16" fill="#1e293b" rx="3" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="490" y1="394" x2="473" y2="382" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="518" y1="394" x2="535" y2="382" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="490" y1="402" x2="473" y2="414" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="518" y1="402" x2="535" y2="414" stroke="#22c55e" stroke-width="1.5"/>
  <ellipse cx="469" cy="380" rx="10" ry="3" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <ellipse cx="539" cy="380" rx="10" ry="3" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <ellipse cx="469" cy="416" rx="10" ry="3" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <ellipse cx="539" cy="416" rx="10" ry="3" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.5"/>

  <!-- Upload beam (dotted) to cloud -->
  <line x1="504" y1="388" x2="620" y2="380" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>
  <!-- Cloud icon -->
  <circle cx="630" cy="372" r="12" fill="rgba(34,197,94,0.1)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="630" y="377" text-anchor="middle" fill="#22c55e" font-size="14">☁</text>
  <text x="630" y="395" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="9">server</text>

  <!-- GPS fallback note -->
  <rect x="450" y="428" width="296" height="32" fill="rgba(255,255,255,0.02)" rx="6" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="598" y="441" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="10">GPS: drone first, phone as fallback</text>
  <text x="598" y="455" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="10">Heading + altitude included when available</text>

  <!-- DJI Avata note at bottom -->
  <rect x="40" y="548" width="720" height="54" fill="rgba(245,158,11,0.06)" rx="8" stroke="rgba(245,158,11,0.2)" stroke-width="1"/>
  <text x="400" y="566" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="700">DJI Avata note</text>
  <text x="400" y="582" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="11">The Avata streams via RTMP and embeds no GPS in the stream metadata. Coordinates are a static</text>
  <text x="400" y="596" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="11">fallback (intentional). Full GPS telemetry requires Mavic/Mini via DJI SDK — Phase 2.</text>
</svg>
