<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="900" height="500" fill="#050a0f"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Alert Range: What It Means</text>
  <line x1="40" y1="46" x2="860" y2="46" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
  <text x="450" y="64" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="11">How far from the active FEMA search polygon you can be before the warning fires</text>

  <!-- ===== THREE MAP THUMBNAILS ===== -->

  <!-- THUMBNAIL 1 — 5 mi -->
  <rect x="30" y="78" width="255" height="280" fill="#0d1a0d" rx="10" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Faint map lines -->
  <line x1="30" y1="200" x2="285" y2="195" stroke="rgba(255,255,255,0.04)" stroke-width="3"/>
  <line x1="150" y1="78" x2="152" y2="358" stroke="rgba(255,255,255,0.03)" stroke-width="2"/>

  <!-- Search polygon (amber) -->
  <polygon points="85,140 180,125 220,160 215,240 145,265 85,240 75,185" fill="rgba(245,158,11,0.18)" stroke="#f59e0b" stroke-width="2"/>

  <!-- Alert range circle — small (5 mi, barely outside polygon) -->
  <circle cx="148" cy="200" r="78" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.7"/>

  <!-- Pilot icon — near the circle edge -->
  <circle cx="148" cy="122" r="11" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="148" y="127" text-anchor="middle" font-size="10">🚁</text>

  <!-- Label -->
  <rect x="30" y="358" width="255" height="54" fill="rgba(255,255,255,0.03)" rx="0"/>
  <text x="157" y="376" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="800">5 mi</text>
  <text x="157" y="394" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="10">Warns only when just outside zone.</text>
  <text x="157" y="408" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="10">Best for dedicated search pilots.</text>

  <!-- THUMBNAIL 2 — 25 mi (DEFAULT, highlighted) -->
  <rect x="322" y="78" width="255" height="280" fill="#0d1a0d" rx="10" stroke="#38bdf8" stroke-width="2"/>
  <!-- Blue glow -->
  <rect x="320" y="76" width="259" height="284" fill="none" rx="11" stroke="rgba(56,189,248,0.25)" stroke-width="4"/>

  <!-- DEFAULT badge -->
  <rect x="382" y="82" width="72" height="20" fill="#38bdf8" rx="10"/>
  <text x="418" y="96" text-anchor="middle" fill="#050a0f" font-size="10" font-weight="800">DEFAULT</text>

  <!-- Faint map lines -->
  <line x1="322" y1="200" x2="577" y2="195" stroke="rgba(255,255,255,0.04)" stroke-width="3"/>
  <line x1="448" y1="78" x2="450" y2="358" stroke="rgba(255,255,255,0.03)" stroke-width="2"/>

  <!-- Search polygon -->
  <polygon points="378,155 455,145 495,170 490,240 435,260 375,240 365,195" fill="rgba(245,158,11,0.18)" stroke="#f59e0b" stroke-width="2"/>

  <!-- Alert range circle — medium (25 mi, clear buffer) -->
  <circle cx="448" cy="205" r="100" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Pilot icon — comfortably outside -->
  <circle cx="448" cy="106" r="11" fill="rgba(56,189,248,0.2)" stroke="#38bdf8" stroke-width="2"/>
  <text x="448" y="111" text-anchor="middle" font-size="10">🚁</text>

  <!-- Label -->
  <rect x="322" y="358" width="255" height="54" fill="rgba(56,189,248,0.05)" rx="0"/>
  <text x="449" y="376" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="800">25 mi</text>
  <text x="449" y="394" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="10">Recommended. Warns before you</text>
  <text x="449" y="408" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="10">drift too far from the operation.</text>

  <!-- THUMBNAIL 3 — 100 mi -->
  <rect x="615" y="78" width="255" height="280" fill="#0d1a0d" rx="10" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Faint map lines -->
  <line x1="615" y1="200" x2="870" y2="195" stroke="rgba(255,255,255,0.04)" stroke-width="3"/>
  <line x1="740" y1="78" x2="742" y2="358" stroke="rgba(255,255,255,0.03)" stroke-width="2"/>

  <!-- Search polygon (small, centered) -->
  <polygon points="695,185 730,178 750,192 748,222 720,232 694,222 686,203" fill="rgba(245,158,11,0.18)" stroke="#f59e0b" stroke-width="2"/>

  <!-- Alert range circle — huge (100 mi, nearly fills frame) -->
  <circle cx="742" cy="205" r="128" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- Pilot icon — far corner -->
  <circle cx="742" cy="92" r="11" fill="rgba(56,189,248,0.12)" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
  <text x="742" y="97" text-anchor="middle" font-size="10" opacity="0.7">🚁</text>

  <!-- Label -->
  <rect x="615" y="358" width="255" height="54" fill="rgba(255,255,255,0.03)" rx="0"/>
  <text x="742" y="376" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="800">100 mi</text>
  <text x="742" y="394" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="10">Wide patrol route or regional</text>
  <text x="742" y="408" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="10">coverage area. Rarely warns.</text>

  <!-- ===== TOGGLE SECTION ===== -->
  <line x1="40" y1="426" x2="860" y2="426" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="450" y="447" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="12">
    <tspan font-weight="700" fill="rgba(255,255,255,0.7)">Show out-of-range warning</tspan>
    — toggle in Settings → Alert Range
  </text>

  <!-- Toggle visual -->
  <rect x="340" y="456" width="220" height="36" fill="rgba(255,255,255,0.03)" rx="8" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <!-- ON state -->
  <rect x="352" y="464" width="52" height="20" fill="rgba(56,189,248,0.15)" rx="6" stroke="rgba(56,189,248,0.35)" stroke-width="1"/>
  <text x="378" y="478" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">ON</text>
  <text x="420" y="478" fill="rgba(255,255,255,0.4)" font-size="11">banner + push notification active</text>
  <!-- Separator -->
  <line x1="350" y1="466" x2="350" y2="490" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <text x="450" y="494" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-size="10">When OFF, both the on-screen banner and push notification are suppressed.</text>
</svg>
