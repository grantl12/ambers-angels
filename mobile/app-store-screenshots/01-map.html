<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1320px; height: 2868px; overflow: hidden;
    background: #050a0f; font-family: -apple-system, 'SF Pro Display', sans-serif;
    position: relative;
  }

  /* Status bar */
  .status-bar {
    position: absolute; top: 0; left: 0; right: 0; height: 54px;
    background: rgba(0,0,0,0.4); z-index: 100;
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 40px 8px;
  }
  .status-time { color: #fff; font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .status-icons { display: flex; gap: 10px; align-items: center; }
  .status-icons svg { fill: white; }

  /* Map background */
  .map {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse 800px 600px at 30% 45%, rgba(20,60,20,0.9) 0%, transparent 70%),
      radial-gradient(ellipse 600px 400px at 70% 30%, rgba(15,40,15,0.8) 0%, transparent 60%),
      radial-gradient(ellipse 900px 700px at 50% 70%, rgba(10,30,10,0.7) 0%, transparent 70%),
      linear-gradient(165deg, #0d1a0d 0%, #0a1a12 30%, #0d1f0d 60%, #091508 100%);
  }

  /* Roads */
  .road-h1 { position: absolute; top: 38%; left: 0; right: 0; height: 6px; background: rgba(180,160,80,0.35); }
  .road-h2 { position: absolute; top: 55%; left: 0; right: 0; height: 4px; background: rgba(160,140,60,0.25); }
  .road-h3 { position: absolute; top: 72%; left: 0; right: 0; height: 3px; background: rgba(140,120,50,0.2); }
  .road-v1 { position: absolute; left: 42%; top: 0; bottom: 0; width: 5px; background: rgba(180,160,80,0.3); }
  .road-v2 { position: absolute; left: 65%; top: 0; bottom: 0; width: 4px; background: rgba(160,140,60,0.25); }
  .road-v3 { position: absolute; left: 28%; top: 0; bottom: 0; width: 3px; background: rgba(140,120,50,0.18); }

  /* Terrain patches */
  .terrain-1 {
    position: absolute; top: 20%; left: 10%; width: 320px; height: 240px;
    background: rgba(20,60,20,0.5); border-radius: 50%;
  }
  .terrain-2 {
    position: absolute; top: 50%; left: 55%; width: 280px; height: 200px;
    background: rgba(15,50,15,0.4); border-radius: 40%;
  }
  .terrain-3 {
    position: absolute; top: 65%; left: 15%; width: 400px; height: 300px;
    background: rgba(25,65,20,0.45); border-radius: 45%;
  }

  /* AMBER alert polygon */
  .alert-polygon {
    position: absolute;
    top: 220px; left: 120px; width: 680px; height: 520px;
    background: rgba(245,158,11,0.12);
    border: 3px solid rgba(245,158,11,0.6);
    clip-path: polygon(8% 15%, 45% 0%, 90% 12%, 100% 48%, 85% 88%, 40% 100%, 5% 82%, 0% 45%);
  }

  /* Blue alert polygon */
  .alert-polygon-2 {
    position: absolute;
    top: 1050px; left: 550px; width: 540px; height: 400px;
    background: rgba(59,130,246,0.1);
    border: 2px solid rgba(59,130,246,0.5);
    clip-path: polygon(15% 0%, 85% 5%, 100% 40%, 90% 85%, 50% 100%, 10% 90%, 0% 55%);
  }

  /* Priority zone */
  .priority-zone {
    position: absolute;
    top: 700px; left: 200px; width: 360px; height: 280px;
    background: rgba(239,68,68,0.1);
    border: 2px solid rgba(239,68,68,0.4);
    clip-path: polygon(0% 20%, 20% 0%, 80% 0%, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0% 80%);
  }

  /* Drone markers */
  .marker {
    position: absolute; z-index: 50;
    display: flex; flex-direction: column; align-items: center;
  }
  .marker-dot {
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(0,0,0,0.7); border: 2px solid #a78bfa;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    box-shadow: 0 0 20px rgba(167,139,250,0.4);
  }
  .marker-dot.car { border-color: #38bdf8; box-shadow: 0 0 20px rgba(56,189,248,0.4); }
  .marker-dot.active { border-color: #22c55e; box-shadow: 0 0 24px rgba(34,197,94,0.5); }

  /* Alert pin */
  .alert-pin {
    position: absolute; z-index: 50;
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(0,0,0,0.8); border: 2px solid #f59e0b;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    box-shadow: 0 0 20px rgba(245,158,11,0.4);
  }

  /* Your location */
  .my-location {
    position: absolute; z-index: 60;
    width: 40px; height: 40px; border-radius: 50%;
    background: #3b82f6;
    border: 4px solid #fff;
    box-shadow: 0 0 0 12px rgba(59,130,246,0.2), 0 4px 12px rgba(0,0,0,0.4);
  }

  /* Top badges */
  .badge {
    position: absolute; z-index: 80;
    background: rgba(10,15,22,0.92);
    border-radius: 40px; border: 1px solid rgba(167,139,250,0.4);
    padding: 14px 28px;
    display: flex; align-items: center; gap: 10px;
  }
  .badge-text { color: #a78bfa; font-size: 24px; font-weight: 700; }
  .badge-dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; animation: pulse 1.5s infinite; }
  .badge-alert { border-color: rgba(245,158,11,0.5); top: 130px; }
  .badge-alert .badge-text { color: #f59e0b; }

  /* Priority toggle */
  .priority-toggle {
    position: absolute; bottom: 260px; right: 30px; z-index: 80;
    background: rgba(10,15,22,0.92); border-radius: 12px;
    border: 1px solid rgba(239,68,68,0.4);
    padding: 14px 20px;
  }
  .priority-toggle-text { color: #f87171; font-size: 22px; font-weight: 700; }

  /* Bottom tab bar */
  .tab-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 160px;
    background: rgba(9,12,18,0.97);
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: flex-start; justify-content: space-around;
    padding-top: 16px; z-index: 100;
  }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .tab-icon { font-size: 36px; }
  .tab-label { font-size: 18px; font-weight: 600; }
  .tab.active .tab-label { color: #f59e0b; }
  .tab:not(.active) .tab-label { color: rgba(255,255,255,0.35); }

  /* Caption overlay */
  .caption-overlay {
    position: absolute; bottom: 175px; left: 0; right: 0; z-index: 90;
    text-align: center; padding: 0 40px;
  }
  .caption-pill {
    display: inline-block;
    background: rgba(245,158,11,0.15);
    border: 1px solid rgba(245,158,11,0.4);
    border-radius: 999px;
    padding: 10px 32px;
    color: #f59e0b;
    font-size: 22px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 16px;
  }
  .caption-heading {
    color: #fff; font-size: 54px; font-weight: 800; line-height: 1.1; margin-bottom: 12px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.8);
  }
  .caption-sub {
    color: rgba(255,255,255,0.55); font-size: 26px; font-weight: 500; line-height: 1.4;
  }
</style>
</head>
<body>

<!-- Map base -->
<div class="map">
  <div class="terrain-1"></div>
  <div class="terrain-2"></div>
  <div class="terrain-3"></div>
  <div class="road-h1"></div>
  <div class="road-h2"></div>
  <div class="road-h3"></div>
  <div class="road-v1"></div>
  <div class="road-v2"></div>
  <div class="road-v3"></div>
</div>

<!-- Alert polygons -->
<div class="alert-polygon"></div>
<div class="alert-polygon-2"></div>
<div class="priority-zone"></div>

<!-- Alert pins -->
<div class="alert-pin" style="top:340px; left:460px;">🚨</div>
<div class="alert-pin" style="top:1120px; left:780px; border-color:#3b82f6; box-shadow: 0 0 20px rgba(59,130,246,0.4);">🚨</div>

<!-- Drone / volunteer markers -->
<div class="marker" style="top:290px; left:610px;">
  <div class="marker-dot active">🚁</div>
</div>
<div class="marker" style="top:520px; left:220px;">
  <div class="marker-dot">🚁</div>
</div>
<div class="marker" style="top:650px; left:840px;">
  <div class="marker-dot car">🚗</div>
</div>
<div class="marker" style="top:950px; left:380px;">
  <div class="marker-dot">🚁</div>
</div>
<div class="marker" style="top:1080px; left:680px;">
  <div class="marker-dot car">🚗</div>
</div>
<div class="marker" style="top:820px; left:1050px;">
  <div class="marker-dot active">📱</div>
</div>
<div class="marker" style="top:440px; left:980px;">
  <div class="marker-dot">🚁</div>
</div>

<!-- My location -->
<div class="my-location" style="top:760px; left:590px;"></div>

<!-- Status bar -->
<div class="status-bar">
  <span class="status-time">9:41</span>
  <div class="status-icons">
    <svg width="22" height="16" viewBox="0 0 22 16"><rect x="0" y="4" width="4" height="12" rx="1"/><rect x="6" y="2" width="4" height="14" rx="1"/><rect x="12" y="0" width="4" height="16" rx="1"/><rect x="18" y="0" width="4" height="16" rx="1" opacity="0.3"/></svg>
    <svg width="24" height="16" viewBox="0 0 24 16"><path d="M12 3C7 3 2.8 5.2 0 8.6l2 2C4.2 7.7 7.9 6 12 6s7.8 1.7 10 4.6l2-2C21.2 5.2 17 3 12 3zM12 9c-2.6 0-5 1-6.8 2.7l2 2C8.4 12.6 10.1 12 12 12s3.6.6 4.8 1.7l2-2C16.9 10 14.6 9 12 9zM12 15l2 2-2 2-2-2 2-2z"/></svg>
    <svg width="40" height="18" viewBox="0 0 40 18"><rect x="0" y="3" width="34" height="14" rx="4" stroke="white" stroke-width="1.5" fill="none"/><rect x="34.5" y="7" width="3" height="6" rx="1.5" fill="white" opacity="0.6"/><rect x="2" y="5" width="28" height="10" rx="2" fill="white"/></svg>
  </div>
</div>

<!-- Volunteer count badge -->
<div class="badge" style="top: 72px; left: 50%; transform: translateX(-50%);">
  <div class="badge-dot"></div>
  <span class="badge-text">7 volunteers online</span>
</div>

<!-- Alert count badge -->
<div class="badge badge-alert" style="top: 156px; left: 50%; transform: translateX(-50%);">
  <span class="badge-text">3 active alerts</span>
</div>

<!-- Priority zone toggle -->
<div class="priority-toggle">
  <span class="priority-toggle-text">▣ Flight priority zones</span>
</div>

<!-- Caption -->
<div class="caption-overlay" style="bottom: 195px;">
  <div style="text-align:center; margin-bottom: 32px;">
    <div class="caption-pill">Live Mission Map</div>
    <div class="caption-heading">Track every volunteer<br>in real time</div>
    <div class="caption-sub">AMBER, SILVER, and BLUE alert zones<br>overlay directly on the mission map</div>
  </div>
</div>

<!-- Bottom tab bar -->
<div class="tab-bar">
  <div class="tab active">
    <span class="tab-icon">🗺️</span>
    <span class="tab-label" style="color:#f59e0b;">Map</span>
  </div>
  <div class="tab">
    <span class="tab-icon">📷</span>

  </div>
  <div class="tab">
    <span class="tab-icon">📋</span>
    <span class="tab-label">Feed</span>
  </div>
  <div class="tab">
    <span class="tab-icon">⚙️</span>
    <span class="tab-label">Settings</span>
  </div>
</div>

</body>
</html>
