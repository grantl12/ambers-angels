// DJI Camera native module build config
// This file is consumed by the root project via the Expo config plugin.

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 35
    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 35
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    // Required for DJI SDK — prevents duplicate .so conflicts
    packagingOptions {
        pickFirst 'lib/armeabi-v7a/libcrypto.so'
        pickFirst 'lib/arm64-v8a/libcrypto.so'
        pickFirst 'lib/x86/libcrypto.so'
        pickFirst 'lib/x86_64/libcrypto.so'
        // V5 native libs — must not be stripped by the linker
        doNotStrip '*/*/libdjisdk_jni.so'
        doNotStrip '*/*/libdcl_jni.so'
        doNotStrip '*/*/libartcm_jni.so'
        doNotStrip '*/*/libmrtc_core_jni.so'
        doNotStrip '*/*/libdjifs_jni-CSDK.so'
        doNotStrip '*/*/libDJIFlySafeCore-CSDK.so'
        doNotStrip '*/*/libDJIWaypointV2Core-CSDK.so'
        doNotStrip '*/*/libFlightRecordEngine.so'
        doNotStrip '*/*/libDJIRegister.so'
        doNotStrip '*/*/libdjibase.so'
    }
    namespace 'com.ambersangels.djicamera'
}

// No repositories block needed — DJI maven URL is added to allprojects by the config plugin.

dependencies {
    compileOnly 'com.facebook.react:react-android:+'

    // DJI MSDK V5 (5.17.0 — latest confirmed on Maven Central as of 2026-06)
    // Uses Waypoint 3.0 API (dji.v5.manager.aircraft.waypoint3) — waypoint5 package
    // does not exist in this version. FlightControllerManager absent; RTH via KeyManager.
    implementation 'com.dji:dji-sdk-v5-aircraft:5.17.0'
    compileOnly  'com.dji:dji-sdk-v5-aircraft-provided:5.17.0'
    implementation 'com.dji:dji-sdk-v5-networkImp:5.17.0'
}
