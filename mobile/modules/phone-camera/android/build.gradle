apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 35
    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 35
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    namespace 'com.ambersangels.phonecamera'
}

dependencies {
    compileOnly 'com.facebook.react:react-android:+'

    // GPS updates (LocationManager is framework API — no dep needed)
    // OkHttp for multipart frame upload — also a transitive RN dep
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
