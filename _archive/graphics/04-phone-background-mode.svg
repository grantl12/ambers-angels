<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="540" fill="#050a0f"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Phone Mode: Scan While You Drive</text>
  <line x1="40" y1="48" x2="860" y2="48" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>

  <!-- Center divider -->
  <line x1="450" y1="56" x2="450" y2="496" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- ===== LEFT PANEL ===== -->
  <text x="225" y="74" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="11" font-weight="700" letter-spacing="2">WHAT'S HAPPENING ON YOUR PHONE</text>

  <!-- Phone outer shell -->
  <rect x="120" y="84" width="210" height="370" fill="#0d1117" rx="20" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <!-- Notch -->
  <rect x="190" y="84" width="70" height="12" fill="#050a0f" rx="6"/>
  <!-- Screen area -->
  <rect x="130" y="100" width="190" height="344" fill="#111827" rx="10"/>

  <!-- Status bar -->
  <rect x="130" y="100" width="190" height="20" fill="#0d1117" rx="0"/>
  <text x="140" y="114" fill="rgba(255,255,255,0.5)" font-size="8">9:41</text>
  <text x="308" y="114" text-anchor="end" fill="rgba(255,255,255,0.5)" font-size="8">⚡ 84%</text>

  <!-- Notification bar (amber highlight) -->
  <rect x="130" y="120" width="190" height="32" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
  <circle cx="146" cy="136" r="10" fill="#050a0f"/>
  <text x="146" y="140" text-anchor="middle" fill="#f59e0b" font-size="10">🔍</text>
  <text x="160" y="133" fill="#ffffff" font-size="9" font-weight="600">Amber's Angels</text>
  <text x="160" y="146" fill="rgba(255,255,255,0.5)" font-size="8">42 frames · STOP</text>

  <!-- Partially visible app card (Angels) behind -->
  <rect x="130" y="152" width="190" height="48" fill="#0f2233" rx="4" opacity="0.7"/>
  <text x="140" y="172" fill="rgba(56,189,248,0.5)" font-size="9" font-weight="700">AMBER'S ANGELS</text>
  <text x="140" y="186" fill="rgba(255,255,255,0.3)" font-size="8">Scanning... 42 frames sent</text>

  <!-- Google Maps card (in focus) -->
  <rect x="130" y="200" width="190" height="180" fill="#1a2a1a" rx="4"/>
  <!-- Fake map bg -->
  <rect x="130" y="200" width="190" height="180" fill="#1c2b1c" rx="4"/>
  <!-- Road lines -->
  <line x1="130" y1="260" x2="320" y2="260" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
  <line x1="225" y1="200" x2="225" y2="380" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
  <!-- Map label -->
  <text x="225" y="300" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="10" font-weight="600">Google Maps</text>
  <text x="225" y="315" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="9">Navigation active</text>
  <!-- Nav arrow -->
  <polygon points="225,330 215,350 225,345 235,350" fill="#4285f4" opacity="0.8"/>

  <!-- Bottom home bar -->
  <rect x="130" y="380" width="190" height="64" fill="#0d1117" rx="0"/>
  <circle cx="180" cy="412" r="18" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="180" y="417" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="10">Maps</text>
  <circle cx="225" cy="412" r="18" fill="#1e293b" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>
  <text x="225" y="417" text-anchor="middle" fill="rgba(56,189,248,0.6)" font-size="10">AA</text>
  <circle cx="270" cy="412" r="18" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="270" y="417" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="10">Uber</text>

  <!-- Callout for notification bar -->
  <line x1="320" y1="136" x2="356" y2="136" stroke="rgba(245,158,11,0.5)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="360" y="132" fill="#f59e0b" font-size="10" font-weight="600">Persistent notification</text>
  <text x="360" y="147" fill="rgba(255,255,255,0.4)" font-size="10">keeps scan service alive</text>
  <text x="360" y="162" fill="rgba(255,255,255,0.4)" font-size="10">even when backgrounded</text>

  <!-- iOS note -->
  <rect x="46" y="470" width="356" height="28" fill="rgba(245,158,11,0.06)" rx="6" stroke="rgba(245,158,11,0.2)" stroke-width="1"/>
  <text x="224" y="488" text-anchor="middle" fill="rgba(245,158,11,0.7)" font-size="11">iOS: keep the app foregrounded for continuous scanning</text>

  <!-- ===== RIGHT PANEL ===== -->
  <text x="675" y="74" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="11" font-weight="700" letter-spacing="2">WHAT THE APP IS DOING</text>

  <!-- Flow steps -->
  <!-- Step 1 -->
  <rect x="498" y="90" width="340" height="56" fill="rgba(56,189,248,0.07)" rx="8" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>
  <circle cx="524" cy="118" r="14" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="524" y="123" text-anchor="middle" fill="#38bdf8" font-size="14">📷</text>
  <text x="548" y="114" fill="#ffffff" font-size="13" font-weight="600">Camera captures JPEG frame</text>
  <text x="548" y="130" fill="rgba(255,255,255,0.45)" font-size="11">Every N seconds (your capture interval setting)</text>

  <!-- Arrow 1→2 -->
  <line x1="675" y1="146" x2="675" y2="162" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Step 2 -->
  <rect x="498" y="164" width="340" height="56" fill="rgba(56,189,248,0.07)" rx="8" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>
  <circle cx="524" cy="192" r="14" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="524" y="197" text-anchor="middle" fill="#38bdf8" font-size="14">📍</text>
  <text x="548" y="188" fill="#ffffff" font-size="13" font-weight="600">GPS coordinates attached</text>
  <text x="548" y="204" fill="rgba(255,255,255,0.45)" font-size="11">Latitude, longitude, altitude, heading, speed</text>

  <!-- Arrow 2→3 -->
  <line x1="675" y1="220" x2="675" y2="236" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Step 3 -->
  <rect x="498" y="238" width="340" height="56" fill="rgba(56,189,248,0.07)" rx="8" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>
  <circle cx="524" cy="266" r="14" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="524" y="271" text-anchor="middle" fill="#38bdf8" font-size="13">☁</text>
  <text x="548" y="262" fill="#ffffff" font-size="13" font-weight="600">Frame uploaded to server</text>
  <text x="548" y="278" fill="rgba(255,255,255,0.45)" font-size="11">POST /ingest/frame — multipart JPEG + GPS</text>

  <!-- Arrow 3→4 -->
  <line x1="675" y1="294" x2="675" y2="310" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Step 4 -->
  <rect x="498" y="312" width="340" height="56" fill="rgba(167,139,250,0.07)" rx="8" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
  <circle cx="524" cy="340" r="14" fill="rgba(167,139,250,0.15)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="524" y="345" text-anchor="middle" fill="#a78bfa" font-size="13">🔍</text>
  <text x="548" y="336" fill="#ffffff" font-size="13" font-weight="600">OpenALPR runs on every frame</text>
  <text x="548" y="352" fill="rgba(255,255,255,0.45)" font-size="11">License plates extracted + confidence scored</text>

  <!-- Arrow 4→5 -->
  <line x1="675" y1="368" x2="675" y2="384" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Step 5 -->
  <rect x="498" y="386" width="340" height="56" fill="rgba(34,197,94,0.07)" rx="8" stroke="rgba(34,197,94,0.2)" stroke-width="1"/>
  <circle cx="524" cy="414" r="14" fill="rgba(34,197,94,0.15)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="524" y="419" text-anchor="middle" fill="#22c55e" font-size="13">🚨</text>
  <text x="548" y="410" fill="#ffffff" font-size="13" font-weight="600">Watchlist match → Discord alert</text>
  <text x="548" y="426" fill="rgba(255,255,255,0.45)" font-size="11">Photo + plate + GPS pinged to coordinator channel</text>

  <!-- YOLO note -->
  <rect x="498" y="452" width="340" height="36" fill="rgba(255,255,255,0.02)" rx="6" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="668" y="466" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="10">YOLO vehicle scoring runs in parallel —</text>
  <text x="668" y="480" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="10">corroborates plate reads with vehicle type/color match</text>
</svg>
