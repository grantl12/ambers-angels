<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="540" fill="#050a0f"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="1">Optimal Camera Angle for Plate Reads</text>
  <line x1="60" y1="50" x2="740" y2="50" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>

  <!-- Sky gradient band -->
  <rect x="0" y="54" width="800" height="290" fill="rgba(56,189,248,0.03)"/>

  <!-- Ground / road -->
  <rect x="0" y="344" width="800" height="196" fill="#0d1117"/>
  <line x1="0" y1="344" x2="800" y2="344" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Road markings -->
  <rect x="0" y="370" width="800" height="100" fill="rgba(255,255,255,0.03)" rx="0"/>
  <line x1="100" y1="420" x2="200" y2="420" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-dasharray="20,20"/>
  <line x1="300" y1="420" x2="400" y2="420" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-dasharray="20,20"/>
  <line x1="500" y1="420" x2="600" y2="420" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-dasharray="20,20"/>
  <line x1="700" y1="420" x2="780" y2="420" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-dasharray="20,20"/>

  <!-- Car silhouette at x=400 on road -->
  <!-- Car body -->
  <rect x="330" y="356" width="120" height="44" fill="#1e293b" rx="4" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Car roof -->
  <rect x="350" y="340" width="80" height="20" fill="#1e293b" rx="3" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <!-- Windshield -->
  <rect x="354" y="342" width="72" height="16" fill="rgba(56,189,248,0.15)" rx="2"/>
  <!-- Wheels -->
  <circle cx="355" cy="402" r="10" fill="#0d1117" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <circle cx="445" cy="402" r="10" fill="#0d1117" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <!-- License plate -->
  <rect x="375" y="392" width="30" height="10" fill="#e2e8f0" rx="1"/>
  <text x="390" y="400" text-anchor="middle" fill="#050a0f" font-size="6" font-weight="700">ABC 123</text>

  <!-- Drone at top center x=400 y=100 -->
  <!-- Drone body -->
  <rect x="384" y="90" width="32" height="18" fill="#1e293b" rx="4" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="400" cy="99" r="5" fill="#38bdf8" opacity="0.8"/>
  <!-- Arms -->
  <line x1="384" y1="94" x2="358" y2="78" stroke="#38bdf8" stroke-width="2"/>
  <line x1="416" y1="94" x2="442" y2="78" stroke="#38bdf8" stroke-width="2"/>
  <line x1="384" y1="104" x2="358" y2="118" stroke="#38bdf8" stroke-width="2"/>
  <line x1="416" y1="104" x2="442" y2="118" stroke="#38bdf8" stroke-width="2"/>
  <!-- Propellers -->
  <ellipse cx="354" cy="76" rx="14" ry="4" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="446" cy="76" rx="14" ry="4" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="354" cy="120" rx="14" ry="4" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="446" cy="120" rx="14" ry="4" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>

  <!-- ANGLE 1: 45-60 degrees — BEST (blue/green) -->
  <!-- From drone center (400,99) to car plate area (390, 356) -->
  <line x1="400" y1="108" x2="392" y2="350" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrow-blue)"/>
  <!-- Angle arc -->
  <path d="M 400 130 A 32 32 0 0 1 390 155" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <!-- Label -->
  <rect x="220" y="148" width="155" height="52" fill="rgba(34,197,94,0.12)" rx="6" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
  <text x="298" y="167" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="700">45–60° BEST</text>
  <text x="298" y="184" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="10">Reduces glare &amp; distortion</text>
  <line x1="375" y1="174" x2="340" y2="200" stroke="rgba(34,197,94,0.4)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ANGLE 2: ~75 degrees — OK (amber) -->
  <!-- Steeper line -->
  <line x1="402" y1="108" x2="450" y2="340" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-amber)"/>
  <!-- Label -->
  <rect x="468" y="168" width="140" height="52" fill="rgba(245,158,11,0.1)" rx="6" stroke="rgba(245,158,11,0.35)" stroke-width="1"/>
  <text x="538" y="187" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700">70–80° OK</text>
  <text x="538" y="204" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="10">Usable at low altitude</text>
  <line x1="468" y1="194" x2="440" y2="220" stroke="rgba(245,158,11,0.35)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ANGLE 3: ~85 degrees — AVOID (red) -->
  <line x1="403" y1="108" x2="520" y2="336" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-red)"/>
  <!-- Label -->
  <rect x="560" y="230" width="160" height="52" fill="rgba(239,68,68,0.1)" rx="6" stroke="rgba(239,68,68,0.35)" stroke-width="1"/>
  <text x="640" y="249" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="700">80–90° AVOID</text>
  <text x="640" y="266" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="10">Plate obscured, motion blur</text>
  <line x1="560" y1="256" x2="530" y2="260" stroke="rgba(239,68,68,0.35)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Altitude label -->
  <line x1="90" y1="108" x2="90" y2="344" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="82" y1="108" x2="98" y2="108" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="82" y1="344" x2="98" y2="344" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <text x="78" y="230" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="11" transform="rotate(-90,78,230)">altitude AGL</text>
  <text x="55" y="140" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">≤200 ft</text>
  <text x="55" y="155" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="10">for best reads</text>

  <!-- Callout box bottom -->
  <rect x="40" y="456" width="720" height="66" fill="rgba(56,189,248,0.06)" rx="8" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>
  <text x="60" y="477" fill="#38bdf8" font-size="13" font-weight="700">TIP</text>
  <text x="98" y="477" fill="rgba(255,255,255,0.7)" font-size="12">Fly no higher than 200 ft AGL for reliable plate reads.</text>
  <text x="60" y="498" fill="rgba(255,255,255,0.7)" font-size="12">Slower flight speed = sharper frames = better OpenALPR confidence scores.</text>
  <text x="60" y="515" fill="rgba(255,255,255,0.5)" font-size="11">45-60° oblique angle reduces infrared glare and perspective distortion for YOLOv8/ALPR.</text>
</svg>
