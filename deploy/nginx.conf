# Amber's Angels — nginx reverse proxy
#
# Serves two domains on the same DigitalOcean Droplet:
#   amberangels.org / www  →  Next.js web app (port 3000)
#   api.amberangels.org    →  FastAPI backend (port 8000)

# ── ROOT DOMAIN — HTTP → HTTPS redirect + Certbot challenge ──────────────────
server {
    listen 80;
    listen [::]:80;
    server_name amberangels.org www.amberangels.org;

    # Certbot HTTP-01 challenge — must be here BEFORE the redirect
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://amberangels.org$request_uri;
    }
}

# ── ROOT DOMAIN — HTTPS → Next.js ────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name amberangels.org www.amberangels.org;

    ssl_certificate     /etc/letsencrypt/live/amberangels.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amberangels.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # www → apex redirect
    if ($host = www.amberangels.org) {
        return 301 https://amberangels.org$request_uri;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }
}



# Redirect all HTTP → HTTPS for api subdomain
server {
    listen 80;
    listen [::]:80;
    server_name api.amberangels.org;
    return 301 https://$host$request_uri;
}

# API HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.amberangels.org;

    # Certbot paths for api subdomain
    ssl_certificate     /etc/letsencrypt/live/api.amberangels.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.amberangels.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── FastAPI backend (/api/* and WebSocket) ────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 20M;  # allow frame uploads
    }

    # ── Frame thumbnails ─────────────────
    location /frames/ {
        proxy_pass http://127.0.0.1:8000/frames/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Block direct access to dotfiles
    location ~ /\. {
        deny all;
    }
}
