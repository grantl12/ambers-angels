# Amber's Angels — nginx reverse proxy with HTTPS
#
# Prerequisites on the VPS:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d amberangels.org -d www.amberangels.org
#   (Certbot will auto-populate the ssl_certificate lines below and schedule renewal)
#
# After certbot runs, the ssl_* lines below will be filled in automatically.
# Copy this file to /etc/nginx/sites-available/ambersangels and symlink it:
#   sudo ln -s /etc/nginx/sites-available/ambersangels /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Redirect all HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name amberangels.org www.amberangels.org;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name amberangels.org www.amberangels.org;

    # Certbot will populate these paths after running:
    #   sudo certbot --nginx -d amberangels.org -d www.amberangels.org
    ssl_certificate     /etc/letsencrypt/live/amberangels.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amberangels.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── FastAPI backend (/api/* and WebSocket) ────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 20M;  # allow frame uploads
    }

    # ── Frame thumbnails (served directly by FastAPI /frames) ─────────────────
    location /frames/ {
        proxy_pass http://127.0.0.1:8000/frames/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Next.js web dashboard ─────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── RTMP ingest (if using nginx-rtmp-module) ──────────────────────────────
    # RTMP runs on its own TCP port (1935) — handled in the stream {} block
    # at the top of nginx.conf, not here.

    # Block direct access to dotfiles
    location ~ /\. {
        deny all;
    }
}
